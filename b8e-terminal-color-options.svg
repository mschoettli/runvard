      <use href="#prompt-angle" class="cyan" transform="translate(145 151) scale(.72)"/>
      <use href="#prompt-underscore" class="cyan" transform="translate(169 193)"/>
    </g>
    <text class="word" x="72" y="415">Runvard</text>
  </g>

  <g transform="translate(400 0)">
    <text class="label" x="40" y="58">E2</text>
    <g transform="translate(85 88)">
      <use href="#logo-base"/>
      <use href="#prompt-angle" class="cyan" transform="translate(145 151) scale(.72)"/>
      <use href="#prompt-underscore" class="white" transform="translate(169 193)"/>
    </g>
    <text class="word" x="72" y="415">Runvard</text>
  </g>

  <g transform="translate(800 0)">
    <text class="label" x="40" y="58">E3</text>
    <g transform="translate(85 88)">
      <use href="#logo-base"/>
      <use href="#prompt-angle" class="cyan" transform="translate(145 151) scale(.72)"/>
      <use href="#prompt-underscore" class="green" transform="translate(169 193)"/>
    </g>
    <text class="word" x="72" y="415">Runvard</text>
  </g>

  <g transform="translate(1200 0)">
    <text class="label" x="40" y="58">E4</text>
    <g transform="translate(85 88)">
      <use href="#logo-base"/>
      <path class="cyan" d="M161 155l28 27-28 27h-16l25-27-25-27z"/>
      <rect class="cyan" x="170" y="194" width="39" height="9" rx="2"/>
    </g>
    <text class="word" x="72" y="415">Runvard</text>
  </g>

  <g transform="translate(0 550)">
    <text class="label" x="40" y="58">E5</text>
    <g transform="translate(85 88)">
      <use href="#logo-base"/>
      <path class="teal" d="M155 154h32l-31 55h-31z"/>
      <rect class="cyan" x="170" y="194" width="42" height="10" rx="2"/>
    </g>
    <text class="word" x="72" y="415">Runvard</text>
  </g>

  <g transform="translate(400 550)">
