  </g>

  <g id="prompt-underscore">
    <rect x="0" y="0" width="44" height="10" rx="2"/>
  </g>

  <g transform="translate(0 0)">
    <text class="label" x="40" y="58">E1</text>
    <g transform="translate(85 88)">
