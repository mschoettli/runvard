<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .bg { fill: #f7f9fb; }
      .grid { stroke: #d9e1e7; stroke-width: 2; }
      .label, .word { fill: #07131d; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 800; }
      .label { font-size: 34px; }
      .word { font-size: 58px; letter-spacing: 0; }
      .tile { fill: #0d1b24; }
      .r { fill: #ffffff; }
      .cyan { fill: #18d2d0; }
      .teal { fill: #12a89e; }
      .green { fill: #35df72; }
      .blue { fill: #4aa8ff; }
      .muted { fill: #72b8b7; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1100"/>
  <path class="grid" d="M400 0v1100M800 0v1100M1200 0v1100M0 550h1600"/>

  <g id="logo-base">
    <rect class="tile" x="0" y="0" width="230" height="230" rx="34"/>
    <path class="r" d="M49 39h126l36 35v37l-52 50 48 48h-55l-72-72v72H48V95h97l21 21-33 31H80v62H49z"/>
  </g>

  <g id="prompt-angle">
