name: Signed release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-i18n.mjs
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Build immutable release archive
        shell: bash
        run: |
          set -euo pipefail
          root="runvard-${GITHUB_REF_NAME}"
          mkdir -p "dist/${root}"
          git archive HEAD | tar -x -C "dist/${root}"
          printf '%s\n' "$GITHUB_SHA" > "dist/${root}/RELEASE_COMMIT"
          tar -czf "dist/runvard-${GITHUB_REF_NAME}.tar.gz" -C dist "$root"
          sha256sum "dist/runvard-${GITHUB_REF_NAME}.tar.gz" > "dist/runvard-${GITHUB_REF_NAME}.tar.gz.sha256"
          cp install.sh dist/install.sh
      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: "dist/runvard-${{ github.ref_name }}.tar.gz"
      - name: Attest bootstrap provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/install.sh
      - name: Publish verified assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/runvard-${{ github.ref_name }}.tar.gz
            dist/runvard-${{ github.ref_name }}.tar.gz.sha256
            dist/install.sh
