      if(!c)return;
      if(!r||r.resultCount===0){c.textContent='0/0';c.style.color='var(--text3)';}
      else{c.textContent=`${(r.resultIndex>=0?r.resultIndex+1:0)}/${r.resultCount}`;c.style.color='var(--accent-light)';}
    });
  }catch(e){}

  // Klickbare Links
  try{term.loadAddon(new WebLinksAddon.WebLinksAddon());}catch(e){}

  term.open($('#terminal'));

  // DOM-Renderer (stabil, kein Black-Screen ohne GPU/WebGL); webgl-Var bleibt für Dispose
  let webgl=null;

  // Unicode 11 (Emoji/CJK-Breiten)
  try{term.loadAddon(new Unicode11Addon.Unicode11Addon());term.unicode.activeVersion='11';}catch(e){}

  fit.fit();
  term.focus();

  const sendResize=()=>{if(termWs&&termWs.readyState===1)termWs.send(JSON.stringify({type:'resize',rows:term.rows,cols:term.cols}));};
  let terminalActive=true,reconnectTimer=null,heartbeatTimer=null,reconnectAttempts=0,connectSeq=0,hasConnected=false;
  const clearReconnectTimer=()=>{
    if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null;}
  };
  const clearHeartbeatTimer=()=>{
    if(heartbeatTimer){clearInterval(heartbeatTimer);heartbeatTimer=null;}
  };
  const setStatus=(state,label)=>{
    const dot=$('#term-dot'),txt=$('#term-state'),rc=$('#term-reconnect');
    if(!dot)return;
    dot.className='dot '+(state==='ok'?'ok':state==='off'?'off':'wait');
    txt.textContent=uiText(label||(state==='ok'?'connected':state==='off'?'disconnected':'connecting…'));
    if(rc)rc.style.display=(state==='ok'||(!hasConnected&&state==='wait'))?'none':'';
  };
  const scheduleReconnect=()=>{
    if(!terminalActive)return;
    clearReconnectTimer();
    clearHeartbeatTimer();
    reconnectAttempts+=1;
    const delay=Math.min(8000,500*Math.pow(1.7,reconnectAttempts-1));
    setStatus('wait','reconnecting…');
    reconnectTimer=setTimeout(()=>connect(),delay);
  };
  const startHeartbeat=(ws,seq)=>{
    clearHeartbeatTimer();
    let lastPong=Date.now();
    const sendPing=()=>{
      if(!terminalActive||seq!==connectSeq||termWs!==ws){clearHeartbeatTimer();return;}
      if(ws.readyState!==1)return;
      if(Date.now()-lastPong>15000){
        try{ws.close(4000,'heartbeat timeout');}catch(_){}
        return;
      }
      try{ws.send(JSON.stringify({type:'ping'}));}catch(_){try{ws.close(4000,'heartbeat failed');}catch(e){}}
    };
    heartbeatTimer=setInterval(sendPing,5000);
    sendPing();
    return ()=>{lastPong=Date.now();};
  };

  // (Wieder-)Verbinden – term-Instanz bleibt erhalten
  function connect(){
    if(!terminalActive)return;
    clearReconnectTimer();
    clearHeartbeatTimer();
    setStatus('wait',hasConnected?'reconnecting…':'connecting…');
    const proto=location.protocol==='https:'?'wss':'ws';
    const seq=++connectSeq;
    const ws=new WebSocket(`${proto}://${location.host}/ws/terminal`);
    termWs=ws;
    let opened=false,markPong=null;
    ws.onopen=()=>{
      if(!terminalActive||seq!==connectSeq||termWs!==ws)return;
      opened=true;
      reconnectAttempts=0;
      if(hasConnected){try{term.write('\r\n\x1b[2m\x1b[32m── Reconnected ──\x1b[0m\r\n');}catch(_){}}
      hasConnected=true;
      setStatus('ok');
      sendResize();
      markPong=startHeartbeat(ws,seq);
      term.focus();
    };
    ws.onmessage=e=>{
      if(!terminalActive||seq!==connectSeq||termWs!==ws)return;
      if(e.data==='\0runvard:pong'){if(markPong)markPong();return;}
      term.write(e.data);
    };
    ws.onclose=e=>{
      if(seq!==connectSeq||termWs!==ws)return;
      clearHeartbeatTimer();
      termWs=null;
      if(!terminalActive)return;
      if(e&&e.code===1008){
        setStatus('off');
        try{term.write('\r\n\x1b[2m\x1b[31m── Terminal access denied ──\x1b[0m\r\n');}catch(_){}
        return;
      }
      if(opened){try{term.write('\r\n\x1b[2m\x1b[33m── Connection lost, reconnecting ──\x1b[0m\r\n');}catch(_){}}
      scheduleReconnect();
    };
    ws.onerror=()=>{
      if(seq===connectSeq&&termWs===ws)setStatus('wait','reconnecting…');
    };
  }
  // Eingaben gehen immer an die aktuelle Verbindung (auch nach Reconnect)
  term.onData(d=>{if(termWs&&termWs.readyState===1)termWs.send(JSON.stringify({type:'input',data:d}));});

  // Tastatur: Copy/Paste/Suche, Strg+V an Shell durchreichen
  term.attachCustomKeyEventHandler(e=>{
    if(e.type!=='keydown')return true;
    if(e.ctrlKey&&e.shiftKey&&(e.key==='C'||e.key==='c')){e.preventDefault();window.termCopy();return false;}
    if(e.ctrlKey&&e.shiftKey&&(e.key==='V'||e.key==='v')){e.preventDefault();window.termPaste();return false;}
    if(e.ctrlKey&&e.shiftKey&&(e.key==='F'||e.key==='f')){e.preventDefault();window.termSearchToggle(true);return false;}
    if(e.ctrlKey&&!e.shiftKey&&(e.key==='v'||e.key==='V'))return false; // Browser-Paste, kein ^V
    return true;
  });

  // ── Globale Handler (eine Terminal-Instanz aktiv) ──
  window._term=term;
  window.termCopy=async()=>{
    const sel=term.getSelection();
    if(!sel){toast('Nothing selected','error');return;}
    try{await navigator.clipboard.writeText(sel);toast('Kopiert ✓');}
    catch(e){
      const ta=document.createElement('textarea');ta.value=sel;
      ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');toast('Kopiert ✓');}catch(_){toast('Kopieren fehlgeschlagen','error');}
      document.body.removeChild(ta);term.focus();
    }
  };
  window.termPaste=async()=>{
    try{
      const t=await navigator.clipboard.readText();
      if(t&&termWs&&termWs.readyState===1)termWs.send(JSON.stringify({type:'input',data:t}));
      term.focus();
    }catch(e){toast('Paste blocked – use Ctrl+V','error');}
  };
  window.termClear=()=>{term.clear();term.focus();};
  window.termZoom=delta=>{
    fontSize=Math.max(8,Math.min(28,fontSize+delta));
    term.options.fontSize=fontSize;
    const z=$('#term-zoom');if(z)z.textContent=fontSize+'px';
    fit.fit();sendResize();
  };
  window.termReconnect=()=>{
    clearReconnectTimer();
    reconnectAttempts=0;
    if(termWs){try{termWs.close();}catch(_){}}
    connect();
  };
  const runSearch=(dir)=>{
    const q=($('#term-search-input')||{}).value||'';
    if(!q){search.clearDecorations&&search.clearDecorations();const c=$('#term-search-count');if(c){c.textContent='0/0';c.style.color='var(--text3)';}return;}
    const opts={...searchOpts,decorations:TERM_SEARCH_DECO};
    if(dir==='prev')search.findPrevious(q,opts);else search.findNext(q,opts);
  };
  window.termFindNext=()=>runSearch('next');
  window.termFindPrev=()=>runSearch('prev');
  window.termToggleOpt=k=>{
    searchOpts[k]=!searchOpts[k];
    const el=$('#term-opt-'+k);if(el)el.classList.toggle('active',searchOpts[k]);
    runSearch('next');
  };
  window.termSearchToggle=(force)=>{
    const bar=$('#term-searchbar');if(!bar)return;
    const open=typeof force==='boolean'?force:!bar.classList.contains('open');
    bar.classList.toggle('open',open);
    if(open){const i=$('#term-search-input');if(i){i.focus();i.select();}}
    else{search.clearDecorations&&search.clearDecorations();term.focus();const c=$('#term-search-count');if(c){c.textContent='0/0';c.style.color='var(--text3)';}}
  };

  // Suchfeld-Tasten
  const si=$('#term-search-input');
  if(si){
    si.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();runSearch(e.shiftKey?'prev':'next');}
      else if(e.key==='Escape'){e.preventDefault();window.termSearchToggle(false);}
    });
    si.addEventListener('input',()=>runSearch('next'));
  }

  // Aufräum-Hook für closeModal
  window._termDispose=()=>{
    terminalActive=false;
    clearReconnectTimer();
    clearHeartbeatTimer();
    connectSeq+=1;
    try{webgl&&webgl.dispose();}catch(_){}
    try{search.dispose();}catch(_){}
    try{term.dispose();}catch(_){}
    window._term=null;window._termDispose=null;
  };

  new ResizeObserver(()=>{try{fit.fit();}catch(_){}sendResize();}).observe($('#terminal'));
  connect();
}

function fileIcon(e){
  const n=(e.name||'').toLowerCase();
  if(e.is_dir){
    if(n==='.docker'||n==='docker') return {icon:'🐳',cls:'fi-code',ncls:'fn-color-code'};
    if(n==='.ssh') return {icon:'🔑',cls:'fi-lock',ncls:'fn-color-default'};
    return {icon:'📁',cls:'fi-folder',ncls:'fn-color-folder'};
  }
  if(e.readonly) return {icon:'🔒',cls:'fi-lock',ncls:'fn-color-default'};
  const ext=(n.split('.').pop()||'');
  if(['jpg','jpeg','png','gif','webp','svg','bmp','ico','tiff'].includes(ext)) return {icon:'🖼',cls:'fi-img',ncls:'fn-color-img'};
  if(['mp4','webm','mkv','avi','mov','flv','wmv'].includes(ext)) return {icon:'🎬',cls:'fi-video',ncls:'fn-color-video'};
  if(['mp3','wav','flac','ogg','aac','m4a'].includes(ext)) return {icon:'🎵',cls:'fi-video',ncls:'fn-color-video'};
  if(['pdf'].includes(ext)) return {icon:'📕',cls:'fi-pdf',ncls:'fn-color-pdf'};
  if(['zip','tar','gz','rar','7z','bz2','xz'].includes(ext)) return {icon:'📦',cls:'fi-archive',ncls:'fn-color-archive'};
  if(['md','markdown','txt','doc','docx','odt','rtf'].includes(ext)) return {icon:'📝',cls:'fi-doc',ncls:'fn-color-doc'};
  if(['xls','xlsx','csv','ods'].includes(ext)) return {icon:'📊',cls:'fi-doc',ncls:'fn-color-doc'};
  if(['ppt','pptx','odp'].includes(ext)) return {icon:'📙',cls:'fi-archive',ncls:'fn-color-archive'};
  if(['iso','img','qcow2','vmdk'].includes(ext)) return {icon:'💿',cls:'fi-code',ncls:'fn-color-code'};
  if(['sh','py','js','ts','json','yaml','yml','conf','ini','xml','css','html','toml','cfg','go','rs','c','cpp','java','rb','php'].includes(ext)) return {icon:'⚙',cls:'fi-code',ncls:'fn-color-code'};
  return {icon:'📄',cls:'fi-doc',ncls:'fn-color-default'};
}

function sortEntries(entries){
  return [...entries].sort((a,b)=>{
    if(a.is_dir!==b.is_dir) return a.is_dir?-1:1;
    let v=0;
    if(sortBy==='name') v=a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'});
    if(sortBy==='size') v=(a.size||0)-(b.size||0);
    if(sortBy==='date') v=(a.modified||0)-(b.modified||0);
    if(sortBy==='type') v=(a.mime||'').localeCompare(b.mime||'')||a.name.localeCompare(b.name);
    return sortDir==='desc'?-v:v;
  });
}

function setFileSort(key){
  if(sortBy===key) sortDir=sortDir==='asc'?'desc':'asc';
  else{sortBy=key;sortDir=(key==='name'||key==='type')?'asc':'desc';}
  renderFiles($('#modal-body'));
}

function sortMark(key){return sortBy===key?(sortDir==='asc'?' ↑':' ↓'):'';}

async function renderFiles(body){

  const [data,mountData]=await Promise.all([
    api('/files/list?path='+encodeURIComponent(currentPath)),
    api('/files/mounts').catch(()=>({mounts:[]}))
  ]);
  const entries=sortEntries(data.entries);
  fileEntryMeta=new Map(entries.map(e=>[e.path,{is_dir:!!e.is_dir,readonly:!!e.readonly}]));
  fileSelectionOrder=entries.filter(e=>!e.blocked).map(e=>e.path);
  selectedFiles=new Set([...selectedFiles].filter(p=>fileSelectionOrder.includes(p)));
  const remoteMounts=(mountData.mounts||[]);
  const pathParts=data.path.split('/').filter(Boolean);
  const bcHtml=pathParts.map((p,i)=>{
    const full='/'+pathParts.slice(0,i+1).join('/');
    const isCurrent=i===pathParts.length-1;
    return `${i>0?'<span class="bc-sep">›</span>':''}<span class="bc-seg${isCurrent?' current':''}" onclick="navTo('${esc(full)}')">${esc(p)}</span>`;
  }).join('');
  body.innerHTML=`
  <div class="files-layout">

function setupFileInteractions(){
  setupFileDropUpload();
  setupFileMarquee();
  setupFilesHotkeys();
  setupFilesGlobalDrop();
}

function setupFileDropUpload(){
  const sc=$('#files-scroll');
  if(!sc) return;
  const leave=e=>{
    if(!sc.contains(e.relatedTarget)) sc.classList.remove('drag-over');
  };
  sc.addEventListener('dragenter',e=>{
    if(!fileDragHasExternalFiles(e))return;
    e.preventDefault();sc.classList.add('drag-over');
  });
  sc.addEventListener('dragover',e=>{
    if(!fileDragHasExternalFiles(e))return;
    e.preventDefault();e.dataTransfer.dropEffect='copy';sc.classList.add('drag-over');
  });
  sc.addEventListener('dragleave',leave);
  sc.addEventListener('drop',e=>{
    if(!fileDragHasExternalFiles(e))return;
    e.preventDefault();
    e.stopPropagation();
    sc.classList.remove('drag-over');
    const files=fileDropFiles(e);
    if(files.length) uploadFileList(files,currentPath);
  });
}

function filesDropActive(){
  if(!currentTile||currentTile.id!=='files'||currentPath==='__trash__')return false;
  const form=$('#form-overlay'), confirm=$('#confirm-overlay');
  if(form&&form.classList.contains('open'))return false;
  if(confirm&&confirm.classList.contains('open'))return false;
  return !!$('#files-scroll');
}

function fileDropFiles(e){
  return [...(e.dataTransfer?.files||[])].filter(f=>f&&f.name);
}

function fileDragHasExternalFiles(e){
  return Array.from(e.dataTransfer?.types||[]).includes('Files');
}
function markFileExternalDrop(on){
  $('#files-scroll')?.classList.toggle('drag-over',!!on);
}
function clearFileDragState(){
  document.querySelectorAll('#file-area .dragging,#file-area .drop-target').forEach(el=>el.classList.remove('dragging','drop-target'));
  markFileExternalDrop(false);
  fileExternalDragDepth=0;
}
function fileParentPath(path){
  const parts=String(path||'').split('/').filter(Boolean);
  parts.pop();
  return parts.length?'/'+parts.join('/'):'/';
}
function fileDropWouldNest(path,dstDir){
  const meta=fileEntryMeta.get(path);
  return !!(meta&&meta.is_dir&&(dstDir===path||dstDir.startsWith(path+'/')));
}
function fileDraggedPathsFor(path){
  return selectedFiles.has(path)?[...selectedFiles]:[path];
}
function fileDragElement(path){
  return document.querySelector(`#file-area [data-path="${cssEscape(path)}"]`);
}
function cssEscape(value){
  if(window.CSS&&CSS.escape)return CSS.escape(value);
  return String(value).replace(/["\\]/g,'\\$&');
}
window.fileDragStart=(e,path,isDir)=>{
  if(currentPath==='__trash__'){e.preventDefault();return;}
  const paths=fileDraggedPathsFor(path);
  if(!selectedFiles.has(path)){
    selectedFiles.clear();
    selectedFiles.add(path);
    lastSelectedPath=path;
    updateFileSelectionUI();
  }
  fileDragPayload={paths,source:path};
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('application/x-runvard-files',JSON.stringify(paths));
  e.dataTransfer.setData('text/plain',paths.join('\n'));
};
window.fileDragEnd=()=>{
  fileDragPayload=null;
  clearFileDragState();
};
window.fileDropTargetEnter=(e,path,isDir)=>{
  if(!fileDragPayload||!isDir)return;
  if(fileDragPayload.paths.includes(path))return;
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.add('drop-target');
};
window.fileDropTargetOver=(e,path,isDir)=>{
  if(!fileDragPayload||!isDir)return;
  if(fileDragPayload.paths.includes(path))return;
  e.preventDefault();
  e.stopPropagation();
  e.dataTransfer.dropEffect='move';
  e.currentTarget.classList.add('drop-target');
};
window.fileDropTargetLeave=e=>{
  e.currentTarget.classList.remove('drop-target');
};
window.fileDropTargetDrop=async(e,path,isDir)=>{
  if(!fileDragPayload||!isDir)return;
  e.preventDefault();
  e.stopPropagation();
  const payload=fileDragPayload;
  fileDragPayload=null;
  clearFileDragState();
  if(payload.paths.includes(path)||payload.paths.some(p=>fileDropWouldNest(p,path))){
    toast(fileText('invalidDrop'),'error');
    return;
  }
  if(payload.paths.every(p=>fileParentPath(p)===path)){
    toast(fileText('sameFolderDrop'),'error');
    return;
  }
  try{
    await startFileJob('move',payload.paths,{dst_dir:path});
    selectedFiles.clear();
    lastSelectedPath=null;
    updateFileSelectionUI();
    toast(fileText('moveJobStarted'));
  }catch(err){toast(err.message,'error');}
};

function setupFilesGlobalDrop(){
  if(filesGlobalDropReady)return;
  filesGlobalDropReady=true;
  document.addEventListener('dragover',e=>{
    if(!filesDropActive()||!fileDragHasExternalFiles(e))return;
    e.preventDefault();
    e.stopPropagation();
    e.dataTransfer.dropEffect='copy';
    markFileExternalDrop(true);
  },true);
  document.addEventListener('dragenter',e=>{
    if(!filesDropActive()||!fileDragHasExternalFiles(e))return;
    e.preventDefault();
    e.stopPropagation();
    fileExternalDragDepth++;
    markFileExternalDrop(true);
  },true);
  document.addEventListener('dragleave',e=>{
    if(!filesDropActive()||!fileDragHasExternalFiles(e))return;
    fileExternalDragDepth=Math.max(0,fileExternalDragDepth-1);
    if(fileExternalDragDepth===0)markFileExternalDrop(false);
  },true);
  document.addEventListener('drop',e=>{
    if(!filesDropActive()||!fileDragHasExternalFiles(e))return;
    e.preventDefault();
    e.stopPropagation();
    fileExternalDragDepth=0;
    markFileExternalDrop(false);
    const files=fileDropFiles(e);
    if(files.length) uploadFileList(files,currentPath);
  },true);
  document.addEventListener('drop',e=>{
    if(!fileDragPayload)return;
    e.preventDefault();
    fileDragPayload=null;
    clearFileDragState();
  });
}

function setupFileMarquee(){
  const sc=$('#files-scroll');
  if(!sc) return;
  let start=null, box=null, moved=false;
  const rectOf=(x1,y1,x2,y2)=>({
    left:Math.min(x1,x2),top:Math.min(y1,y2),
    right:Math.max(x1,x2),bottom:Math.max(y1,y2)
  });
  const intersects=(a,b)=>!(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom);
  sc.addEventListener('pointerdown',e=>{
    if(e.button!==0||e.target.closest('[data-path],button,input,select,textarea,label'))return;
    start={x:e.clientX,y:e.clientY,add:e.ctrlKey||e.metaKey};
    moved=false;
    box=document.createElement('div');
    box.className='file-marquee';
    document.body.appendChild(box);
    sc.setPointerCapture?.(e.pointerId);
    e.preventDefault();
  });
  sc.addEventListener('pointermove',e=>{
    if(!start||!box)return;
    const r=rectOf(start.x,start.y,e.clientX,e.clientY);
    moved=moved||Math.abs(e.clientX-start.x)>4||Math.abs(e.clientY-start.y)>4;
    box.style.left=r.left+'px';box.style.top=r.top+'px';
    box.style.width=(r.right-r.left)+'px';box.style.height=(r.bottom-r.top)+'px';
    if(!moved)return;
    if(!start.add) selectedFiles.clear();
    document.querySelectorAll('#file-area [data-path]').forEach(el=>{
      if(intersects(r,el.getBoundingClientRect())) selectedFiles.add(el.dataset.path);
    });
    updateFileSelectionUI();
  });
  const end=e=>{
    if(!start)return;
    if(box){box.remove();box=null;}
    if(!moved&&!start.add){selectedFiles.clear();updateFileSelectionUI();}
    start=null;
  };
  sc.addEventListener('pointerup',end);
  sc.addEventListener('pointercancel',end);
}

function setupFilesHotkeys(){
  if(filesHotkeysReady)return;
  filesHotkeysReady=true;
  document.addEventListener('keydown',e=>{
    if(!currentTile||currentTile.id!=='files')return;
    if(e.target.closest('input,textarea,select'))return;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){
      e.preventDefault();
      fileSelectionOrder.forEach(p=>selectedFiles.add(p));
      updateFileSelectionUI();
    }else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'){
      e.preventDefault();
      if(e.shiftKey) copyText(selectedFiles.size===1?[...selectedFiles][0]:currentPath);
      else bulkCopy();
    }else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='x'){
      e.preventDefault();bulkCut();
    }else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'){
      e.preventDefault();pasteClipboard();
    }else if(e.key==='Delete'||e.key==='Backspace'){
      if(selectedFiles.size){e.preventDefault();bulkDelete();}
    }else if(e.key==='Escape'){
      selectedFiles.clear();updateFileSelectionUI();closeCtx();
    }
  });
  document.addEventListener('paste',e=>{
    if(!currentTile||currentTile.id!=='files')return;
    if(e.target.closest('input,textarea'))return;
    const files=[...(e.clipboardData?.files||[])];
    if(files.length){e.preventDefault();uploadFileList(files,currentPath);}
  });
}

let fileUploadHideTimer=null;
function ensureFileUploadIndicator(){
  const host=ensureInstallIndicatorHost();
  if(!host)return null;
  clearTimeout(fileUploadHideTimer);
  let indicator=$('#file-upload-indicator');
  if(!indicator){
    indicator=document.createElement('div');
    indicator.id='file-upload-indicator';
    indicator.className='install-indicator';
    indicator.innerHTML=`<span class="install-dot"></span><span class="install-label" id="file-upload-label">${esc(fileText('upload'))}</span><span class="install-bar-wrap"><span class="install-bar-fill" id="file-upload-fill"></span></span><span class="install-pct" id="file-upload-pct">0%</span>`;
    host.insertBefore(indicator,host.firstChild);
  }
  indicator.classList.remove('done','error');
  return indicator;
}
function setFileUploadIndicator(done,total,label){
  const indicator=ensureFileUploadIndicator();
  if(!indicator)return;
  const pct=Math.max(0,Math.min(100,(Number(done)||0)/Math.max(1,Number(total)||1)*100));
  const labelEl=$('#file-upload-label'),fill=$('#file-upload-fill'),pctEl=$('#file-upload-pct');
  if(labelEl)labelEl.textContent=progressText(label||fileText('upload'));
  if(fill)fill.style.width=pct.toFixed(1)+'%';
  if(pctEl)pctEl.textContent=Math.round(pct)+'%';
}
function finishFileUploadIndicator(label,ok=true){
  const indicator=$('#file-upload-indicator');
  if(!indicator)return;
  clearTimeout(fileUploadHideTimer);
  const labelEl=$('#file-upload-label'),fill=$('#file-upload-fill'),pctEl=$('#file-upload-pct');
  if(labelEl)labelEl.textContent=progressText(label||fileText(ok?'uploadComplete':'uploadFailed'));
  if(fill)fill.style.width='100%';
  if(pctEl)pctEl.textContent='100%';
  indicator.classList.toggle('done',!!ok);
  indicator.classList.toggle('error',!ok);
  fileUploadHideTimer=setTimeout(()=>indicator.remove(),ok?1400:2600);
}

async function uploadFileList(files,targetPath=currentPath){
  files=[...files]; if(!files.length)return;
  startTopProgress(`Uploading 1/${files.length}`,files.length);
  setFileUploadIndicator(0,files.length,`Uploading 1/${files.length}`);
  try{
    for(let i=0;i<files.length;i++){
      setTopProgress(i,`Uploading ${i+1}/${files.length}`);
      setFileUploadIndicator(i,files.length,`Uploading ${i+1}/${files.length}`);
      await uploadFileWithProgress(files[i],i,files.length,targetPath);
      setTopProgress(i+1,`Uploading ${i+1}/${files.length}`);
      setFileUploadIndicator(i+1,files.length,`Uploading ${i+1}/${files.length}`);
    }
    finishTopProgress('Upload complete');
    finishFileUploadIndicator('Upload complete',true);
    toast(fileText('uploadedMany',files.length));
    renderFiles($('#modal-body'));
  }catch(e){
    failTopProgress('Upload failed');
    finishFileUploadIndicator('Upload failed',false);
    toast(e.message,'error');
  }
}

async function startFileJob(action,paths,opts={}){
  if(!paths||!paths.length){toast(fileText('selectFiles'),'error');return null;}
  const job=await post('/files/job',{
    action,
    paths:paths.join('|'),
    dst_dir:opts.dst_dir||'',
    output:opts.output||''
  });
  watchFileJob(job.id);
  return job;
}

function fileJobLabel(job){
  const map={copy:'copying',move:'moving',delete:'deleting',zip:'creatingZip'};
  return `${fileText(map[job.action]||'working')} · ${fileText(job.status||'unknown')}`;
}

function paintFileJob(job){
  const strip=$('#file-job-strip'),fill=$('#file-job-fill'),pct=$('#file-job-pct'),label=$('#file-job-label');
  if(!strip||!job)return;
  strip.classList.add('active');
  const p=Math.max(0,Math.min(100,job.progress||0));
  if(fill)fill.style.width=p+'%';
  if(pct)pct.textContent=p+'%';
  if(label)label.textContent=fileJobLabel(job)+(job.current?' · '+job.current.split('/').pop():'');
}

async function watchFileJob(jobId){
  if(fileJobsTimer)clearInterval(fileJobsTimer);
  const poll=async()=>{
    try{
      const job=await api('/files/job?job_id='+encodeURIComponent(jobId));
      paintFileJob(job);
      if(['done','error','unknown'].includes(job.status)){
        clearInterval(fileJobsTimer);fileJobsTimer=null;
        if(job.status==='done'){toast(fileJobLabel(job));renderFiles($('#modal-body'));}
        else toast(job.error||'File job stopped','error');
        setTimeout(()=>{$('#file-job-strip')?.classList.remove('active');},2500);
      }
    }catch(e){clearInterval(fileJobsTimer);fileJobsTimer=null;}
  };
  await poll();
  fileJobsTimer=setInterval(poll,1200);
}

async function resumeFileJobs(){
  try{
    const r=await api('/files/jobs?active=true');
    const job=(r.jobs||[])[0];
    if(job)watchFileJob(job.id);
  }catch(e){}
}

window.showCtx=(e,path,isDir,readonly)=>{
  e.preventDefault(); e.stopPropagation();
  const old=$('#ctx-menu'); if(old) old.innerHTML='';
  const name=path.split('/').pop();
  if(!selectedFiles.has(path)){
    selectedFiles.clear();
    selectedFiles.add(path);
    lastSelectedPath=path;
    updateFileSelectionUI();
  }
  const paths=[...selectedFiles];
  const multi=paths.length>1;
  const itemLabel=multi?`${paths.length} ${fileText('items')}`:name;
  const items=[
    {icon:'⬇',label:multi?fileText('downloadSelected'):fileText('download'),fn:multi?'bulkDownload()':`downloadFile('${esc(path)}')`},
    (!multi&&!readonly)?{icon:'✎',label:uiText('Rename'),fn:`renameForm('${esc(path)}')`}:null,
    readonly?null:{icon:'📋',label:multi?fileText('copySelected'):fileText('copy'),fn:'bulkCopy()'},
    readonly?null:{icon:'✂',label:multi?fileText('cutSelected'):fileText('cut'),fn:'bulkCut()'},
    clipboard?{icon:'📌',label:fileText('pasteHere'),fn:`pasteClipboard()`}:null,
    {icon:'',label:'─',fn:''},
    (!multi&&isDir&&!readonly)?{icon:'🔗',label:fileText('asSambaShare'),fn:`sambaShareForm('${esc(path)}','${esc(name)}')`}:null,
    !multi?{icon:'🔗',label:fileText('createLink'),fn:`createShareLink('${esc(path)}')`}:null,
    multi?{icon:'📦',label:fileText('createZip'),fn:'bulkZip()'}:(isDir&&path.endsWith('.zip')?null:{icon:'📦',label:path.endsWith('.zip')?fileText('unpack'):fileText('createZip'),fn:path.endsWith('.zip')?`unzipFile('${esc(path)}')` :`zipFile('${esc(path)}')`}),
    {icon:'',label:'─',fn:''},
    readonly?null:{icon:'🗑',label:multi?fileText('deleteSelected'):fileText('delete'),fn:multi?'bulkDelete()':`deleteFile('${esc(path)}')`},
    !multi?{icon:'ℹ',label:fileText('properties'),fn:`showProps('${esc(path)}')`}:null,

// Klick-Logik: Klick = Auswahl, Ctrl/Cmd = hinzufügen, Shift = Bereich
window.fileClick=(e,path,isDir)=>{
  e.preventDefault();
  if(e.shiftKey&&lastSelectedPath&&fileSelectionOrder.includes(lastSelectedPath)){
    if(!(e.ctrlKey||e.metaKey)) selectedFiles.clear();
    const a=fileSelectionOrder.indexOf(lastSelectedPath), b=fileSelectionOrder.indexOf(path);
    fileSelectionOrder.slice(Math.min(a,b),Math.max(a,b)+1).forEach(p=>selectedFiles.add(p));
  }else if(e.ctrlKey||e.metaKey){
    selectedFiles.has(path)?selectedFiles.delete(path):selectedFiles.add(path);
    lastSelectedPath=path;
  }else{
    selectedFiles.clear();
    selectedFiles.add(path);
    lastSelectedPath=path;
  }
  updateFileSelectionUI();
};

    if(isMd){

function uploadFileWithProgress(file,index,total,targetPath){
  return new Promise((resolve,reject)=>{
    const fd=new FormData();
    fd.append('path',targetPath);
    fd.append('file',file);
    const xhr=new XMLHttpRequest();
    xhr.open('POST','/api/files/upload');
    xhr.upload.onprogress=e=>{
      const part=e.lengthComputable&&e.total?e.loaded/e.total:0.35;
      setTopProgress(index+part,`Uploading ${index+1}/${total}`);
      setFileUploadIndicator(index+part,total,`Uploading ${index+1}/${total}`);
    };
    xhr.onload=()=>{
      if(xhr.status>=200&&xhr.status<300)resolve(xhr.responseText);
      else reject(new Error((xhr.responseText||xhr.statusText||'Upload failed').slice(0,300)));
    };
    xhr.onerror=()=>reject(new Error('Upload failed'));
    xhr.onabort=()=>reject(new Error('Upload cancelled'));
    xhr.send(fd);
  });
}

function flattenDevs(devs,out=[]){(devs||[]).forEach(d=>{out.push(d);if(d.children)flattenDevs(d.children,out);});return out;}
async function freeDevList(){const d=await api('/storage/devices');return flattenDevs(d.devices).filter(x=>!x.protected&&(x.type==='disk'||x.type==='part'));}
function deviceOption(x){return {value:x.name,label:x.name,sub:[fmtBytes(x.size),x.fstype,x.model].filter(Boolean).join(' · ')};}
function selectedDeviceList(value){return String(value||'').split(',').map(x=>x.trim()).filter(Boolean);}

    html+=`<table style="margin-bottom:14px;table-layout:fixed;width:100%"><thead><tr><th>Pool</th><th style="width:80px">Size</th><th style="width:80px">Belegt</th><th style="width:60px">Cap</th><th style="width:90px">Health</th><th style="width:90px;text-align:right">Aktionen</th></tr></thead><tbody>

        <button class="btn icon danger" title="Destroy pool" onclick="zpoolDestroy('${esc(p.name)}')" style="width:26px;height:26px;font-size:12px">✕</button>

  else{
    html+=`<table style="table-layout:fixed;width:100%"><thead><tr><th>Label</th><th>UUID</th><th>Devices</th><th style="width:70px;text-align:right"></th></tr></thead><tbody>

const NON_WEB_PORTS=new Set([21,22,25,53,110,139,143,389,445,587,636,993,995,1883,2049,2181,3306,33060,4222,5432,5671,5672,6379,8883,9092,9300,11211,27017,27018]);
const WEB_PORTS=new Set([80,443,3000,3001,4200,5000,5173,5601,8000,8008,8080,8081,8082,8096,8123,8443,8834,9000,9001,9090,9443,10000]);
function composePublishedPorts(content){
  const ports=[];
  const serviceRe=/^\s{2,}([A-Za-z0-9_.-]+):\s*$/;
  let service='',inPorts=false,portsIndent=0;
  String(content||'').split(/\r?\n/).forEach(raw=>{
    const line=raw.split('#')[0].replace(/\s+$/,'');
    if(!line.trim())return;
    const indent=line.length-line.trimStart().length;
    const trimmed=line.trim();
    const svc=trimmed.match(/^([A-Za-z0-9_.-]+):\s*$/);
    if(svc&&indent>=2){service=svc[1];inPorts=false;return;}
    if(trimmed==='ports:'){inPorts=true;portsIndent=indent;return;}
    if(inPorts&&indent<=portsIndent){inPorts=false;}
    if(!inPorts||!trimmed.startsWith('- '))return;
    const spec=trimmed.slice(2).trim().replace(/^['"]|['"]$/g,'').split('/')[0];
    const parts=spec.split(':');
    if(parts.length<2)return;
    const published=Number(parts.length===2?parts[0]:parts[parts.length-2]);
    const target=Number(parts[parts.length-1]);
    if(Number.isFinite(published)&&Number.isFinite(target))ports.push({service,published,target});
  });
  return ports;
}
function composeBestWebPort(content){
  const candidates=composePublishedPorts(content).filter(p=>!NON_WEB_PORTS.has(p.published)&&!NON_WEB_PORTS.has(p.target)).map(p=>{
    let score=0;
    if(/web|www|ui|frontend|front|app|server|api|http|nginx|apache|caddy|proxy|dashboard|homepage|admin/i.test(p.service))score+=60;
    if(/db|database|postgres|postgresql|mysql|mariadb|redis|mongo|mongodb|rabbit|broker|kafka|zookeeper|memcached|mqtt/i.test(p.service))score-=80;
    if(WEB_PORTS.has(p.target))score+=50;
    if(WEB_PORTS.has(p.published))score+=25;
    if(p.target===80||p.target===443)score+=20;
    return {...p,score};
  }).filter(p=>p.score>=0).sort((a,b)=>b.score-a.score);
  return candidates[0]?.published||null;
}
function extractPort(content){return composeBestWebPort(content);}

// Container-Shell via PTY-WebSocket (/ws/docker-exec), nutzt xterm wie das Terminal-Modul
window.dockerExec=(id,name)=>{
  const body=$('#modal-body');
  body.style.display='flex';body.style.flexDirection='column';body.style.padding='0';body.style.overflow='hidden';
  body.innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;padding:6px 10px;background:rgba(0,0,0,.3);border-bottom:.5px solid rgba(255,255,255,.06);flex-shrink:0">
      <button class="btn ghost sm" onclick="dockerExecBack()">← Back</button>
      <span style="font-size:12px;color:var(--text2)">Shell: ${esc(name)}</span>
    </div>
    <div id="dexec-term" style="flex:1;overflow:hidden"></div>`;
  const term=new Terminal({fontFamily:"'JetBrains Mono','Cascadia Code',monospace",fontSize:13,lineHeight:1.35,cursorBlink:true,cursorStyle:'bar',cursorWidth:2,copyOnSelect:true,scrollback:5000,allowProposedApi:true,theme:TERM_THEME});
  const fit=new FitAddon.FitAddon();term.loadAddon(fit);
  try{term.loadAddon(new WebLinksAddon.WebLinksAddon());}catch(e){}
  term.open($('#dexec-term'));
  let dwebgl=null;
  try{term.loadAddon(new Unicode11Addon.Unicode11Addon());term.unicode.activeVersion='11';}catch(e){}
  fit.fit();term.focus();
  term.attachCustomKeyEventHandler(e=>{
    if(e.type!=='keydown')return true;
    if(e.ctrlKey&&e.shiftKey&&(e.key==='C'||e.key==='c')){e.preventDefault();const s=term.getSelection();if(s)navigator.clipboard?.writeText(s).then(()=>toast('Kopiert ✓')).catch(()=>{});return false;}
    if(e.ctrlKey&&!e.shiftKey&&(e.key==='v'||e.key==='V'))return false;
    return true;
  });
  const proto=location.protocol==='https:'?'wss':'ws';
  const ws=new WebSocket(`${proto}://${location.host}/ws/docker-exec?id=${encodeURIComponent(id)}`);
  termWs=ws; // damit closeModal die Verbindung schließt
  window._termDispose=()=>{try{dwebgl&&dwebgl.dispose();}catch(_){}try{term.dispose();}catch(_){}window._termDispose=null;};
  ws.onopen=()=>{ws.send(JSON.stringify({type:'resize',rows:term.rows,cols:term.cols}));term.focus();};
  ws.onmessage=e=>term.write(e.data);
  ws.onclose=()=>{try{term.write('\r\n\x1b[2m\x1b[33m── Connection closed ──\x1b[0m\r\n');}catch(_){}};
  term.onData(d=>{if(ws.readyState===1)ws.send(JSON.stringify({type:'input',data:d}));});
  new ResizeObserver(()=>{try{fit.fit();}catch(_){}if(ws.readyState===1)ws.send(JSON.stringify({type:'resize',rows:term.rows,cols:term.cols}));}).observe($('#dexec-term'));
};
window.dockerExecBack=()=>{
  if(termWs){try{termWs.close();}catch(e){}termWs=null;}
  if(typeof window._termDispose==='function'){try{window._termDispose();}catch(e){}}
  const b=$('#modal-body');b.style.display='';b.style.flexDirection='';b.style.padding='';b.style.overflow='';

const composeEnvFields=(data={})=>[
  {name:'env_enabled',label:'Use .env file',type:'checkbox',value:!!data.env_enabled,hint:'Stores a .env file next to docker-compose.yml.'},
  {name:'env_content',label:'.env',type:'textarea',rows:6,value:data.env_content||'',placeholder:'KEY=value\nANOTHER_KEY=value',showWhen:'env_enabled'}

window.composeForm=()=>openForm('Compose project','🐳',[{name:'name',label:'Project name',placeholder:'meine-app'},{name:'content',label:'docker-compose.yml',type:'textarea',rows:12,value:'services:\n  web:\n    image: nginx:latest\n    ports:\n      - "8080:80"'},...composeEnvFields()],async d=>{
  const field=$('#field_content');
  field?.classList.remove('conflict');
  const check=await post('/docker/compose/check-ports',{name:d.name,content:d.content});
  if(check&&check.ok===false){
    field?.classList.add('conflict');
    const ports=(check.conflicts||[]).map(x=>x.port).join(', ');
    toast(uiText('Choose free host ports before saving')+(ports?': '+ports:''),'error');
    return;
  }
  const r=await post('/docker/compose/save',{name:d.name,content:d.content,env_enabled:d.env_enabled?'1':'0',env_content:d.env_content||''});
  requireOk(r,'Could not save Compose project');
  await composeAddToDashboard(d.name,composeFirstPort(d.content),false);closeForm();toast('Project saved');renderDocker($('#modal-body'),'Compose');
});
window.composeEdit=async name=>{
  try{
    const c=await api('/docker/compose/get?name='+encodeURIComponent(name));
    const diskData=await api('/system/disks').catch(()=>[]);
    const draft=appComposeProjectDraft(name,c);
    draft.mounts=appInstallMounts(diskData);
    draft.volumes.forEach(v=>{if(v.managed)v.mountpoint=appInstallBestMount(draft.mounts,appInstallVolumeRole(v));});
    appComposeFormOpen(draft,{
      title:'Compose: '+name,
      icon:'🐳',
      description:'Edit docker-compose.yml and optional .env values for this project.',
      primaryLabel:'Save',
      onSubmit:async currentDraft=>{
        const content=appInstallCompose(currentDraft);
        const r=await post('/docker/compose/save',{
          name,
          content,
          env_enabled:currentDraft.envFileEnabled?'1':'0',
          env_content:currentDraft.envFileContent||''
        });
        requireOk(r,'Could not save Compose project');
        closeForm();toast(uiText('Saved'));
        renderDocker($('#modal-body'),'Compose');
        loadDashboard();
      },
    });
  }catch(e){toast('Error: '+e.message,'error');}
};
window.composeAct=async(name,action)=>{
  composePendingActions.set(name,action);
  toast(action==='up'?'Starte '+name+'…':'Stoppe '+name+'…');
  renderDocker($('#modal-body'),'Compose');
  try{
    const r=await post('/docker/compose/action',{name,action});
    requireOk(r,(r&&r.output)||'Compose action failed');
    const msgs={up:'Project started: '+name,down:'Project stopped: '+name,stop:'Project stopped: '+name,restart:'Project restarted: '+name};
    toast(msgs[action]||'OK','success');
  }catch(e){
    toast('Error: '+e.message,'error');
  }finally{
    composePendingActions.delete(name);
    renderDocker($('#modal-body'),'Compose');
  }
};
window.composeDelete=name=>typedConfirm('Delete Compose project',`Compose project "${name}" will be stopped and removed.`,name,async()=>{try{const r=await post('/docker/compose/remove',{name});if(r&&r.ok===false){toast(r.stderr||'Error','error');return;}toast('Compose project deleted');renderDocker($('#modal-body'),'Compose');}catch(e){toast('Error: '+e.message,'error');}});

async function renderVMs(body,tab){
  const av=await api('/vms/available');if(!av.available){body.innerHTML='<div class="loading">libvirt unavailable</div>';translateRenderedText(body);return;}
  if(tab==='Speicher-Pools')return renderVmPools(body);
  const v=await api('/vms/list');
  body.innerHTML=`<div class="sec-hdr"><h3>Virtual machines</h3><button class="btn" onclick="vmCreateForm()">+ Create VM</button></div>
  <table><thead><tr><th>Name</th><th>Status</th><th>RAM</th><th>vCPUs</th><th>Actions</th></tr></thead><tbody>
  ${v.map(x=>`<tr data-q="${esc(x.name)}">
    <td>${esc(x.name)}</td>
    <td><span class="status-pill ${x.active?'run':'stop'}">${x.state}</span></td>
    <td>${fmtVmMemory(x.max_mem)}</td><td>${x.vcpus}</td>
    <td style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn icon play" title="${x.active?'Restart':'Start'}" onclick="vmAct('${esc(x.name)}','${x.active?'reboot':'start'}')">${x.active?'↻':'▶'}</button>
      <button class="btn icon stop" title="Shut down" onclick="vmAct('${esc(x.name)}','shutdown')" ${!x.active?'disabled style="opacity:.4"':''}>⏹</button>
      <button class="btn icon" title="Console" onclick="vmConsole('${esc(x.name)}')" ${!x.active?'disabled style="opacity:.4"':''}>🖥</button>
      <button class="btn icon" title="Hardware (Disks/NICs)" onclick="vmHardware('${esc(x.name)}')">🔌</button>
      <button class="btn icon" title="Snapshots" onclick="vmSnaps('${esc(x.name)}')">📸</button>
      <button class="btn icon" title="Clone" onclick="vmClone('${esc(x.name)}')">⎘</button>
      <button class="btn icon" title="CD-ROM" onclick="vmCdromForm('${esc(x.name)}')">💿</button>
      <button class="btn icon danger" title="Delete" onclick="vmDeleteConfirm('${esc(x.name)}')">🗑</button>
    </td></tr>`).join('')||'<tr><td colspan="5" class="loading">No VMs</td></tr>'}</tbody></table>`;
  translateRenderedText(body);
}

window.copyLink=id=>{
  const inp=$('#'+id);
  if(!inp)return;
  inp.select();
  try{
    navigator.clipboard.writeText(inp.value).then(()=>{
      toast('Link copied ✓');
    }).catch(()=>{
      document.execCommand('copy');
      toast('Link copied ✓');
    });
  }catch(e){
    document.execCommand('copy');
    toast('Link copied ✓');
  }
};

          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent-light)">${esc(k.type)}</span>

    try{await post('/security/users/ssh-keys/remove',{name,key:k.key});toast('Key entfernt');renderSshKeys(name);}

  try{const d=await api('/sysmgr/packages/search?q='+encodeURIComponent(q));

window.pkgAction=async(name,action)=>{
  const out=$('#pkg-out'); if(out){out.style.display='block';out.textContent=(action==='install'?'Installiere ':'Entferne ')+name+' …';}
  try{const r=await post('/sysmgr/packages/'+action,{name});
    if(!r||!r.job_id){toast('Start fehlgeschlagen','error');return;}
    pollPkgJob(r.job_id);
  }catch(e){toast('Error: '+e.message,'error');}
};
function pollPkgJob(id){
  const out=$('#pkg-out');
  const tick=async()=>{
    let j;try{j=await api('/sysmgr/job?id='+encodeURIComponent(id));}catch(e){return;}
    if(j.status==='running'){if(out)out.textContent='apt is running … (may take a few minutes)';setTimeout(tick,2500);return;}
    if(j.status==='succeeded'){const res=j.result||{};if(out)out.textContent=(res.stdout||'')+(res.stderr?('\n'+res.stderr):'')||'(fertig)';toast(res.ok===false?'Mit Fehlern beendet':'Fertig',res.ok===false?'error':'success');}
    else{if(out)out.textContent='Error: '+(j.error||'unbekannt');toast('Fehlgeschlagen','error');}
  };
  tick();
}

// Updates installieren (Hintergrund-Job + Polling)
window.updatesInstall=async()=>{
  const reboot=$('#upd-reboot')?.checked;
  const btn=$('#upd-go'); if(btn){btn.disabled=true;btn.textContent=uiText('Installing…');}
  const out=$('#upd-out'); if(out){out.style.display='block';out.textContent=uiText('Starting apt-get upgrade …');}
  try{
    const r=await post('/sysmgr/updates/apply',{});
    if(!r||!r.job_id){toast('Start fehlgeschlagen','error');if(btn){btn.disabled=false;btn.textContent=uiText('⬇ Install updates');}return;}
    pollUpdateJob(r.job_id,reboot);
  }catch(e){toast('Error: '+e.message,'error');if(btn){btn.disabled=false;btn.textContent=uiText('⬇ Install updates');}}
};
function pollUpdateJob(id,reboot){
  const out=$('#upd-out');
  const tick=async()=>{
    let j;
    try{j=await api('/sysmgr/updates/job?id='+encodeURIComponent(id));}
    catch(e){if(out)out.textContent+='\n[Statusabfrage fehlgeschlagen]';return;}
    if(j.status==='running'){if(out)out.textContent=uiText('apt-get upgrade is running … (may take a few minutes)');setTimeout(tick,2500);return;}
    const btn=$('#upd-go');
    if(j.status==='succeeded'){
      const res=j.result||{};
      if(out)out.textContent=(res.stdout||'')+(res.stderr?('\n'+res.stderr):'')||uiText('(no output)');
      toast(res.ok===false?'Mit Fehlern beendet':'Updates installed',res.ok===false?'error':'success');
      if(btn){btn.disabled=false;btn.textContent='✓ '+uiText('Done');}
      if(res.ok!==false){
        _systemUpdateBadgeNext=0;
        refreshSystemUpdateBadge().catch(()=>{});
      }
      if(reboot){
        toast('Reboot starting…');
        try{
          const token=await powerConfirmToken('reboot');
          post('/sysmgr/power',{action:'reboot',delay:0,confirm_token:token});
        }catch(e){toast('Reboot confirmation failed: '+e.message,'error');}
      }
    } else {
      if(out)out.textContent='Error: '+(j.error||'unbekannt');
      toast('Update fehlgeschlagen','error');
      if(btn){btn.disabled=false;btn.textContent=uiText('⬇ Install updates');}
    }
  };
  tick();
}

window.runvardUpdateInstall=async()=>{
  const btn=$('#runvard-upd-go');
  const out=$('#runvard-upd-status');
  const baseline=await api('/sysmgr/runvard-update/log').catch(()=>({log:''}));
  const baselineLog=baseline.log||'';
  if(btn){
    btn.disabled=true;
    btn.textContent=uiText('Update running');
    btn.onclick=null;
    btn.classList.remove('danger');
    btn.classList.add('ghost');
    btn.style.opacity='.65';
    btn.style.cursor='not-allowed';
  }
  if(out){
    out.style.display='grid';
    out.innerHTML=runvardUpdateTerminalHtml(
      'running',
      'Update running',
      'Starting update job...',
      'Waiting for update output...',
      8
    );
  }
  try{
    const r=await post('/sysmgr/runvard-update/apply',{});
    if(!r||r.ok===false){
      throw new Error((r&&r.error)||uiText('Update did not start'));
    }
    toast('runvard update started');
    if(btn)btn.textContent=uiText('Update running');
    pollRunvardUpdateLog(Date.now()+180000,baselineLog);
  }catch(e){
    toast('runvard update failed: '+e.message,'error');
    if(out)out.innerHTML=runvardUpdateTerminalHtml('error','Failed','Failed to start runvard update.',e.message,100);
    if(btn){
      btn.disabled=false;
      btn.textContent=uiText('Update runvard');
      btn.onclick=runvardUpdateInstall;
      btn.classList.remove('ghost','danger');
      btn.style.opacity='';
      btn.style.cursor='';
    }
  }
};
function runvardUpdateInfoHtml(tone,title,detail){
  const cls=tone==='done'?'good':tone==='error'?'bad':'warn';
  return `<div class="nx-action-head" style="margin:0"><div><div class="nx-action-title">${esc(uiText('runvard update'))}</div><div class="nx-action-sub" style="margin:4px 0 0">${esc(uiText(detail))}</div></div>${statusBadge(title,cls)}</div>`;
}
function runvardUpdateTerminalHtml(tone,title,detail,log,progress){
  const cls=tone==='done'?'good':tone==='error'?'bad':'warn';
  const width=Math.max(8,Math.min(100,progress||8));
  const barColor=tone==='done'?'#22c55e':tone==='error'?'#ef4444':'#fbbf24';
  const rawOutput=String(log||'').trim();
  const output=rawOutput?phrase(rawOutput):uiText('Waiting for update output...');
  return `
    <div class="nx-action-head" style="margin:0 0 10px">
      <div>
        <div class="nx-action-title">${esc(uiText('runvard update'))}</div>
        <div class="nx-action-sub" style="margin:4px 0 0">${esc(uiText(detail))}</div>
      </div>
      ${statusBadge(title,cls)}
    </div>
    <div style="height:7px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-bottom:10px">
      <div style="height:100%;width:${width}%;background:${barColor};transition:width .25s ease"></div>
    </div>
    <pre class="logbox" style="margin:0;max-height:220px">${esc(output)}</pre>`;
}
function summarizeRunvardUpdateLog(log){
  const lines=(log||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const important=lines.filter(line=>/runvard update started|Downloading latest|Latest commit|Running installer|runvard update finished|failed|error/i.test(line));
  return important.slice(-6).join('\n');
}
function runvardUpdateProgress(log){
  if(/runvard update finished/i.test(log))return 100;
  if(/Running installer/i.test(log))return 72;
  if(/Latest commit/i.test(log))return 48;
  if(/Downloading latest/i.test(log))return 28;
  if(/runvard update started/i.test(log))return 14;
  return 8;
}
function pollRunvardUpdateLog(until,baselineLog=''){
  const out=$('#runvard-upd-status');
  const btn=$('#runvard-upd-go');
  const tick=async()=>{
    try{
      const r=await api('/sysmgr/runvard-update/log');
      const log=r.log||'';
      const hasNewLog=!!log&&log!==baselineLog;
      const hasStarted=hasNewLog&&/runvard update started|Downloading latest|Latest commit|Running installer/i.test(log);
      if(out){
        const summary=hasNewLog?summarizeRunvardUpdateLog(log):uiText('Waiting for the new update log...');
        out.innerHTML=runvardUpdateTerminalHtml(
          'running',
          'Update running',
          hasStarted?'Installing latest runvard release.':'Waiting for update job output.',
          summary||uiText('runvard update is still running.'),
          hasStarted?runvardUpdateProgress(log):8
        );
      }
      if(hasStarted&&/runvard update finished/i.test(log)){
        toast('runvard update completed');
        if(out){
          out.innerHTML=runvardUpdateTerminalHtml(
            'done',
            'Ready to reload',
            'Update finished. Reload now to use the new version.',
            summarizeRunvardUpdateLog(log)||'runvard update finished.',
            100
          );
        }
        if(btn){
          btn.disabled=false;
          btn.textContent=uiText('Refresh now');
          btn.onclick=()=>location.reload();
          btn.classList.remove('ghost');
          btn.classList.add('danger');
          btn.style.opacity='';
          btn.style.cursor='';
        }
        return;
      }
    }catch(e){
      if(out){
        out.innerHTML=runvardUpdateTerminalHtml(
          'running',
          'Update running',
          'runvard may be restarting. Waiting for the update result.',
          'Connection interrupted while the service restarts...',
          82
        );
      }
    }
    if(Date.now()<until)setTimeout(tick,2500);
    else{
      if(out){
        out.innerHTML=runvardUpdateTerminalHtml(
          'done',
          'Check manually',
          'Polling ended. Reload when you want to check the new version.',
          'Update may still be finishing in the background.',
          100
        );
      }
      if(btn){
        btn.disabled=false;
        btn.textContent=uiText('Refresh now');
        btn.onclick=()=>location.reload();
        btn.classList.remove('ghost');
        btn.classList.add('danger');
        btn.style.opacity='';
        btn.style.cursor='';
      }
    }
  };
  tick();
}

          <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12px;color:var(--text2)">${r.label}</span><span style="font-size:12px;font-family:'JetBrains Mono',monospace">${fmtBytes(r.val)}</span></div>
          <div style="height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden"><div style="width:${barW(r.val)}%;height:100%;background:${r.color};border-radius:4px"></div></div>
        </div>`).join('')}
        ${sw.total?`<div style="margin-top:16px;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">Swap</div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12px;color:var(--text2)">Verwendet</span><span style="font-size:12px;font-family:'JetBrains Mono',monospace">${fmtBytes(sw.used)} / ${fmtBytes(sw.total)}</span></div>

      </div>
      <div>
        <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">Overview</div>
        <table>
          <tr><td>Total</td><td style="font-family:'JetBrains Mono',monospace">${fmtBytes(m.total)}</td></tr>
          <tr><td>Verwendet</td><td style="font-family:'JetBrains Mono',monospace">${fmtBytes(m.used)}</td></tr>
          <tr><td>Available</td><td style="font-family:'JetBrains Mono',monospace">${fmtBytes(m.available)}</td></tr>
          <tr><td>Auslastung</td><td style="font-family:'JetBrains Mono',monospace;color:${m.percent>85?'var(--red)':m.percent>60?'var(--yellow)':'var(--green)'}">${m.percent}%</td></tr>
        </table>
      </div>

    <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">Top processes (RAM)</div>
    <table><thead><tr><th>PID</th><th>Name</th><th>User</th><th>RAM</th><th>CPU</th></tr></thead><tbody>
    ${procs.map(p=>`<tr><td style="font-family:'JetBrains Mono',monospace">${p.pid}</td><td>${esc(p.name)}</td><td>${esc(p.user)}</td><td style="font-family:'JetBrains Mono',monospace;color:${p.ram>500*1024*1024?'var(--yellow)':'var(--text)'}">${fmtBytes(p.ram)}</td><td style="font-family:'JetBrains Mono',monospace">${p.cpu}%</td></tr>`).join('')}
    </tbody></table>`;
  loadHistoryChart('hist-ram',[{field:'ram',label:'RAM %',color:'#06b6d4'}],{max:100,ytick:v=>v+'%'});
}

async function renderDiskDetail(body){
  const [disks,io]=await Promise.all([
    api('/system/disks'), api('/system/disk-io')
  ]);
  body.innerHTML=`
    <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px">Partitionen</div>
    ${disks.map(d=>`
      <div style="margin-bottom:16px;background:var(--glass);border-radius:12px;padding:14px 16px">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px">
          <span style="font-weight:600">${esc(d.mountpoint)}</span>
          <span style="font-size:12px;color:var(--text3)">${esc(d.device)} · ${d.fstype}</span>
        </div>
        <div style="height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-bottom:8px">
          <div style="width:${d.percent}%;height:100%;background:${d.percent>90?'var(--red)':d.percent>70?'var(--yellow)':'linear-gradient(90deg,var(--accent),#06b6d4)'};border-radius:4px;transition:width .5s"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2)">
          <span>Verwendet: <strong>${fmtBytes(d.used)}</strong></span>
          <span style="color:${d.percent>90?'var(--red)':d.percent>70?'var(--yellow)':'var(--green)'}">${d.percent}%</span>
          <span>Frei: <strong>${fmtBytes(d.free)}</strong></span>
          <span>Total: ${fmtBytes(d.total)}</span>
        </div>
      </div>`).join('')}
    ${Object.keys(io).length?`
    <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 12px">Disk I/O</div>
    <table><thead><tr><th>Device</th><th>Gelesen</th><th>Geschrieben</th><th>Read Ops</th><th>Write Ops</th></tr></thead><tbody>
    ${Object.entries(io).map(([dev,c])=>`<tr><td style="font-family:'JetBrains Mono',monospace">${esc(dev)}</td><td>${fmtBytes(c.read_bytes)}</td><td>${fmtBytes(c.write_bytes)}</td><td>${c.read_count.toLocaleString()}</td><td>${c.write_count.toLocaleString()}</td></tr>`).join('')}
    </tbody></table>`:''}`;
}

async function renderNetDetail(body){
  const ifaces=await api('/system/net-detail');
  body.innerHTML=`
    ${histBlock('hist-net','Network throughput')}
    <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px">Interfaces</div>
    ${ifaces.map(i=>`
      <div style="margin-bottom:16px;background:var(--glass);border-radius:12px;padding:14px 16px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
          <span style="width:8px;height:8px;border-radius:50%;background:${i.up?'var(--green)':'var(--red)'};display:inline-block"></span>
          <span style="font-weight:600;font-size:15px">${esc(i.name)}</span>
          <span style="font-size:12px;color:var(--text3)">${i.speed?i.speed+' Mbit':'?'} · MTU ${i.mtu}</span>
          ${i.ipv4?`<span style="margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent-light)">${i.ipv4}</span>`:''}
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
          ${[
            {label:'▲ Gesendet',val:fmtBytes(i.bytes_sent),sub:i.packets_sent.toLocaleString()+' Pakete'},
            {label:'▼ Empfangen',val:fmtBytes(i.bytes_recv),sub:i.packets_recv.toLocaleString()+' Pakete'},
            {label:'Errors in',val:i.errin,sub:'',color:i.errin>0?'var(--red)':''},
            {label:'Errors out',val:i.errout,sub:'',color:i.errout>0?'var(--red)':''},
          ].map(s=>`<div style="background:rgba(255,255,255,.03);border-radius:8px;padding:10px">
            <div style="font-size:10px;color:var(--text3);margin-bottom:4px">${s.label}</div>
            <div style="font-size:14px;font-weight:600;font-family:'JetBrains Mono',monospace${s.color?';color:'+s.color:''}">${s.val}</div>
            ${s.sub?`<div style="font-size:10px;color:var(--text3);margin-top:2px">${s.sub}</div>`:''}
          </div>`).join('')}
        </div>
      </div>`).join('')}`;
  loadHistoryChart('hist-net',[{field:'net_down',label:'▼ Download',color:'#22c55e'},{field:'net_up',label:'▲ Upload',color:'#eab308'}],{scale:v=>+(v/1048576).toFixed(2),ytick:v=>v+' MB/s'});
}

  APP_DESC_ROWS.map(([id,de,en,fr,it,es,pt])=>[id,{de,en,fr,it,es,pt}])

function appLang(){
  const lang=currentLanguage();
  return APP_LANGS.includes(lang)?lang:'en';
}
function appUi(key){
  const item=APP_UI[key];
  return item?(item[appLang()]||item.en||key):key;
}
function appCategoryKey(category){
  return APP_CATEGORY_ALIASES[String(category||'')]||String(category||'').toLowerCase();
}
function appCategoryLabel(category){
  const key=appCategoryKey(category);
  const labels=APP_CATEGORY_LABELS[key];
  return labels?(labels[appLang()]||labels.en):String(category||'');
}
function appCategoryKeys(categories){
  const keys=['all'];
  (categories||[]).forEach(cat=>{
    const key=appCategoryKey(cat);
    if(key&&key!=='all'&&!keys.includes(key))keys.push(key);
  });
  return keys;
}
function localizedAppDesc(app){
  if(app.type==='compose')return app.desc||'Custom Docker Compose project';
  const item=APP_DESC_TRANSLATIONS[app.id];
  return item?(item[appLang()]||item.en||app.desc||''):(app.desc||'');
}
function appIsCompose(app){
  return app?.type==='compose'||String(app?.id||'').startsWith('compose:');
}
function appById(id){
  return appsCatalog.find(a=>a.id===id);
}
function appPendingLabel(action){

function appInstallStepText(step,stepKey){
  const value=String(step||'…');
  const lang=currentLanguage();
  const key=String(stepKey||'');
  const keyed=key?APP_INSTALL_STEP_PHRASES[key]:null;
  if(keyed){
    const base=keyed[lang]||keyed.en||value;
    const colon=value.indexOf(':');
    if(colon>0){
      const detail=value.slice(colon+1).trim();
      return detail?`${base}: ${detail}`:base;
    }
    return base;
  }
  const direct=APP_INSTALL_STEP_PHRASES[value];
  if(direct)return direct[lang]||direct.en||value;
  const colon=value.indexOf(':');
  if(colon>0){
    const label=value.slice(0,colon);
    const detail=value.slice(colon+1).trim();
    const translated=APP_INSTALL_STEP_PHRASES[label];
    if(translated){
      const base=translated[lang]||translated.en||label;
      return detail?`${base}: ${detail}`:base;
    }
  }
  return uiText(value);
}
function appMatchesSearch(app,q){
  if(!q)return true;
  return [
    app.name,
    app.desc,
    localizedAppDesc(app),
    appCategoryLabel(app.category),
    appCategoryKey(app.category),
  ].join(' ').toLowerCase().includes(q);
}

function updateAppsBadge(){
  const el=$('#badge-apps');
  if(!el)return;
  if(_activeInstalls>0){
    el.textContent=_activeInstalls;
    el.className='tile-badge blue';
  } else {
    el.textContent='';
    el.className='tile-badge';
  }
}
function ensureInstallIndicatorHost(){
  const actions=$('#modal-head-actions');
  if(!actions)return null;
  let host=$('#install-indicators');
  if(!host){
    host=document.createElement('div');
    host.id='install-indicators';
    host.style.cssText='display:flex;gap:8px;align-items:center;margin-right:8px';
    actions.insertBefore(host,actions.firstChild);
  }
  return host;
}

async function renderApps(body){
  body.innerHTML='<div class="loading">Loading app catalog…</div>';
  try{
    const data=await api('/apps/catalog');
    appsCatalog=data.apps||[];
    appsCatalogCategories=data.categories||[];
    renderAppsView(body,appsCatalogCategories);
  }catch(e){
    body.innerHTML=`<div class="empty-state">Fehler beim Laden: ${esc(e.message)}</div>`;
  }
}

function renderAppsView(body,categories){
  const q=appsSearch.toLowerCase();
  const filtered=appsCatalog.filter(a=>{
    const catOk=appsActiveCat==='all'||appCategoryKey(a.category)===appsActiveCat;
    return catOk&&appMatchesSearch(a,q);
  });
  const installedCount=appsCatalog.filter(a=>a.installed).length;
  const updateCount=appsCatalog.filter(a=>a.update_available).length;
  const categoryKeys=appCategoryKeys(categories||appsCatalogCategories);

  body.innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
      <input id="apps-search" class="nx-search" placeholder="${esc(appUi('searchApps'))}" value="${esc(appsSearch)}" style="flex:1;min-width:160px;max-width:280px" oninput="appsDoSearch(this.value)">
      <span style="font-size:11px;color:var(--text3)">${appsCatalog.length} ${esc(appUi('apps'))} · ${installedCount} ${esc(appUi('installed'))}${updateCount?` · <span style="color:#fbbf24">${updateCount} ${esc(appUi(updateCount>1?'updates':'update'))}</span>`:''}</span>
      <button class="btn ghost sm" style="margin-left:auto" onclick="appsCheckUpdates()" title="${esc(appUi('checkUpdates'))}">↻ ${esc(appUi('checkUpdates'))}</button>
    </div>
    <div class="apps-cats" id="apps-cats">
      ${categoryKeys.map(c=>`<div class="apps-cat${c===appsActiveCat?' active':''}" onclick="appsSetCat('${esc(c)}')">${esc(appCategoryLabel(c))}</div>`).join('')}
    </div>
    <div class="apps-grid" id="apps-grid">
      ${filtered.length?filtered.map(appCardHtml).join(''):`<div class="empty-state" style="grid-column:1/-1">${esc(appUi('noAppsFound'))}</div>`}
    </div>`;
  nxDecorateSearch(body);
  translateRenderedText(body);
}

}
function appHexA(hex,al){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${al})`;}

function appCardHtml(a){
  const tint=appTint(a.category);
  const isCompose=appIsCompose(a);

async function renderPorts(body){
  body.innerHTML=`<div class="loading">${esc(tr('loading'))}</div>`;
  try{
    const data=await api('/ports');
    const rows=data.ports||[];
    const grouped=Array.from(rows.reduce((map,r)=>{
      const key=[r.app,r.port,r.protocol||'tcp',r.url||''].join('|');
      if(!map.has(key))map.set(key,{app:r.app,port:r.port,protocol:r.protocol||'tcp',url:r.url||'',endpoints:[]});
      const item=map.get(key);
      if(!item.endpoints.some(e=>e.ip===r.ip))item.endpoints.push({ip:r.ip,reachable:!!r.reachable});
      return map;
    },new Map()).values()).sort((a,b)=>a.app.localeCompare(b.app)||Number(a.port)-Number(b.port));
    grouped.forEach(g=>g.endpoints.sort((a,b)=>a.ip.localeCompare(b.ip,undefined,{numeric:true})));
    const urlFor=(ip,port,proto)=>{
      const scheme=(Number(port)===443||Number(port)===8443||Number(port)===9443)?'https':'http';
      return `${scheme}://${ip}:${port}`;
    };
    const portUrlFor=(port,proto)=>{
      const scheme=(Number(port)===443||Number(port)===8443||Number(port)===9443)?'https':'http';
      return `${scheme}://${location.hostname}:${port}`;
    };
    const appNameLabel=uiText('App name');
    const emptyMessage=uiText('No Runvard-managed ports found');
    body.innerHTML=`
      <div class="toolbar" style="margin-bottom:14px;justify-content:flex-end">
        <button class="btn sm ghost" onclick="renderPorts($('#modal-body'))">↻ ${esc(uiText('Refresh'))}</button>
      </div>
      <div style="overflow:auto">
      <table style="table-layout:fixed;min-width:860px">
        <thead><tr><th style="width:26%">${esc(appNameLabel)}</th><th style="width:110px">Port</th><th>IPs</th></tr></thead>
        <tbody>${grouped.map(r=>`
          <tr>
            <td style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.app)}</td>
            <td class="mono" style="white-space:nowrap">${(()=>{const ok=r.endpoints.some(e=>e.reachable);return `<a href="${esc(r.url||portUrlFor(r.port,r.protocol))}" target="_blank" rel="noopener" style="color:var(${ok?'--green':'--red'});text-decoration:none;font-weight:700">${esc(r.port)}${r.protocol&&r.protocol!=='tcp'?'/'+esc(r.protocol):''}</a>`;})()}</td>
            <td style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.endpoints.map(e=>`<a class="mono" href="${esc(urlFor(e.ip,r.port,r.protocol))}" target="_blank" rel="noopener" style="color:var(${e.reachable?'--text':'--red'});text-decoration:none;margin-right:12px">${esc(e.ip)}</a>`).join('')}</td>
          </tr>`).join('')||`<tr><td colspan="3"><div class="empty-state">${esc(emptyMessage)}</div></td></tr>`}</tbody>
      </table>
      </div>`;
    translateRenderedText(body);
    const si=$('#search-input');
    if(searchEnabled&&si)doSearch(si.value||'');
  }catch(e){
    body.innerHTML=`<div class="empty-state">Error: ${esc(e.message)}</div>`;
  }
}

function dashComposeProject(t){
  return t?.project||String(t?.id||'').replace(/^compose:/,'');
}

function dashTileHost(t){
  return String(t?.host||location.hostname).replace(/^https?:\/\//,'').replace(/\/.*$/,'').trim()||location.hostname;
}

function dashTileAddress(t){
  const host=dashTileHost(t);
  return t?.port?`${host}:${t.port}`:host;
}

function dashTileUrl(t){
  return `http://${dashTileAddress(t)}`;
}

function dashTileStatus(t){
  const pending=dashPendingActions.get(t?.id);
  if(pending)return {cls:'pending',title:appPendingLabel(pending)};
  if(t?.type==='app'||t?.type==='compose'){
    return t.running?{cls:'run',title:uiText('Running')}:{cls:'stop',title:uiText('Stopped')};
  }
  if(t?.type==='custom'){
    const health=t.health||{};
    const cls=health.state==='run'?'run':health.state==='stop'?'stop':'pending';
    const label=health.label||'Unknown';
    const detail=health.detail&&health.detail!==label?` · ${health.detail}`:'';
    return {cls,title:label+detail};
  }
  return {cls:'pending',title:'Unknown'};
}

function dashTileIconHtml(icon,name){

function dashSelfhstSlug(value){
  return String(value||'')
    .trim()
    .toLowerCase()
    .replace(/^https?:\/\//,'')
    .replace(/\.[a-z0-9]+$/,'')
    .replace(/&/g,' and ')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'');
}
function dashSelfhstIconCandidates(value){
  const slug=dashSelfhstSlug(value);
  if(!slug)return[];
  const file=encodeURIComponent(slug);
  return [
    `https://cdn.jsdelivr.net/gh/selfhst/icons/svg/${file}.svg`,
    `https://cdn.jsdelivr.net/gh/selfhst/icons/png/${file}.png`,
    `https://raw.githubusercontent.com/selfhst/icons/main/svg/${file}.svg`,
    `https://selfh.st/icons/${file}.svg`
  ];
}
function dashIconSearchTerms(...values){
  const terms=[];
  const add=v=>{
    v=String(v||'').trim();
    if(!v||v.length<=2||v.startsWith('data:image/'))return;
    if(/^https?:\/\//i.test(v)){
      try{
        const host=new URL(v).hostname.replace(/^www\./,'');
        if(host&&!/^\d{1,3}(\.\d{1,3}){3}$/.test(host)){
          add(host);
          add(host.split('.')[0]);
        }
      }catch(e){}
      return;
    }
    const slug=dashSelfhstSlug(v);
    if(slug&&!terms.includes(slug))terms.push(slug);
  };
  values.forEach(add);
  return terms;
}
function dashProbeIcon(url){

    img.src=url;
  });

async function dashFindSelfhstIconForTerms(terms,seq){
  for(const term of (terms||[])){
    for(const url of dashSelfhstIconCandidates(term)){
      if(seq!==undefined&&seq!==dashIconLookupSeq)return null;
      if(await dashProbeIcon(url))return url;
    }
  }
  return '';
}

}
async function dashFindSelfhstIcon(value,seq){

function dashHandleIconInput(){
  const inp=$('#tile-edit-icon');if(!inp)return;
  const value=inp.value.trim();
  dashUpdateEditPreview();
  clearTimeout(dashIconLookupTimer);
  if(!value||value.length<=2||/^https?:\/\//i.test(value)||value.startsWith('data:image/')){
    dashShowIconUpload(false);
    return;
  }
  const seq=++dashIconLookupSeq;
  dashIconLookupTimer=setTimeout(async()=>{
    const found=await dashFindSelfhstIcon(value,seq);
    if(seq!==dashIconLookupSeq||found===null)return;
    if(found){
      inp.value=found;
      dashShowIconUpload(false);
      dashUpdateEditPreview();
    }else{
      dashShowIconUpload(true);
      dashUpdateEditPreview();
    }
  },320);
}

function applyBg(value, save=true){
  const b=document.body;
  // Alte Animationsklassen entfernen
  b.classList.remove('runvard-bg','aurora-bg','sunset-bg','ocean-bg','forest-bg','flame-bg','ice-bg','galaxy-bg');
  b.style.animation='';
  b.style.backgroundAttachment='fixed';
  if(value.startsWith('anim:')){
    const cls=value.slice(5);
    b.className=b.className+' '+cls;
  } else if(value.startsWith('gradient:')){
    b.style.backgroundImage='none';
    b.style.background=value.slice(9);
    b.style.backgroundAttachment='fixed';
  } else if(value.startsWith('color:')){
    b.style.backgroundImage='none';
    b.style.background=value.slice(6);
  } else if(value.startsWith('image:')){
    b.style.background='#0a0b14';
    b.style.backgroundImage='url('+value.slice(6)+')';
    b.style.backgroundSize='cover';
    b.style.backgroundPosition='center';
    b.style.backgroundRepeat='no-repeat';
    b.style.backgroundAttachment='fixed';
  }
  if(save){try{localStorage.setItem(BG_KEY,value);}catch(e){}}
  updatePresetActive(value);
}

function partitionName(name,num=1){const base=name.startsWith('/dev/')?name.slice(5):name;return base+(/\d$/.test(base)?'p':'')+num;}
function defaultMountPoint(name){const base=(name.startsWith('/dev/')?name.slice(5):name).replace(/[^A-Za-z0-9_.-]/g,'-');return '/mnt/'+base;}
function normalizeMountPoint(value,name){const v=(value||'').trim();if(!v)return defaultMountPoint(name);return v.startsWith('/')?v:'/mnt/'+v.replace(/^\/+/,'');}

function isMountableVolume(volume,parent){

async function renderStorage(body,tab){
  if(tab==='Disks'||!tab){
    const [d,mounts]=await Promise.all([api('/storage/devices'),api('/system/disks').catch(()=>[])]);
    const mounted=(mounts||[]).filter(x=>x.total);
    const root=mounted.find(x=>x.mountpoint==='/')||mounted[0];
    body.innerHTML=viewIntro('Storage overview','Set up new disks from here. The system disk is locked so beginners do not accidentally erase runvard.',`<button class="btn" onclick="renderStorage($('#modal-body'),'SMART')">Check health</button>`)
      +`<div class="nx-summary-grid">
        ${summaryCard('Disks',(d.devices||[]).length,'Physical devices found')}
        ${summaryCard('Mounted volumes',mounted.length,'Usable filesystems')}
        ${summaryCard('System disk',root?root.percent+'% used':'Unknown',root?`${fmtBytes(root.used)} / ${fmtBytes(root.total)}`:'No mount data')}
      </div>${renderDeviceCards(d.devices)}`;
    translateRenderedText(body);
    return;
  }
  if(tab==='RAID'){
    const d=await api('/storage/raid');
    body.innerHTML=viewIntro('Protection groups','RAID combines multiple disks for speed or protection. Use Mirror for the easiest safe setup.',`<button class="btn" onclick="raidForm()">Create RAID</button>`)
      +`<div class="nx-card-grid">${(d.arrays||[]).map(a=>`<div class="nx-action-card"><div class="nx-action-head"><div class="nx-action-title">${esc(a.name)}</div>${statusBadge('Active','good')}</div><div class="nx-action-sub">This array is available to the system.</div>${advancedDetails('Technical details',`<pre class="logbox">${esc(a.detail)}</pre>`,false)}</div>`).join('')||emptyState('No RAID groups configured')}</div>`;
    translateRenderedText(body);
    return;
  }
  if(tab==='SMART'){
    const d=await api('/storage/devices');
    const disks=(d.devices||[]).filter(x=>x.type==='disk');
    body.innerHTML=viewIntro('Disk health','SMART helps spot failing drives early. Some virtual or USB disks may not report health data.','')
      +`<div class="nx-card-grid" id="smart-cards">${disks.map(x=>`<div class="nx-action-card"><div class="nx-action-head"><div class="nx-action-title">${esc(x.name)}</div>${statusBadge('Checking','warn')}</div><div class="nx-action-sub">${fmtBytes(x.size)} · ${esc(x.model||'Disk')}</div></div>`).join('')||emptyState('No disks found')}</div>`;
    translateRenderedText(body);
    Promise.all(disks.map(async x=>({disk:x,smart:await api('/storage/smart?device='+encodeURIComponent(x.name)).catch(e=>({available:false,error:e.message}))}))).then(rows=>{

let _appInstallDraft=null;
let _appComposePortCheckTimer=null;

let _appInstallSelectedMount='';
function appInstallJsString(value){
  return JSON.stringify(String(value??'')).replace(/</g,'\\u003c');
}
function appInstallSlug(value,fallback){
  const clean=String(value||'').trim().replace(/^[./]+/,'').replace(/[^A-Za-z0-9_.-]+/g,'-').replace(/^-+|-+$/g,'');
  return clean||fallback||'data';
}
function appInstallBaseName(path,fallback){
  const clean=String(path||'').split(':')[0].replace(/\/+$/,'');
  const base=clean.split('/').filter(Boolean).pop();
  return appInstallSlug(base,fallback);
}
function appInstallIsManagedSource(source){
  return String(source||'').startsWith('./');
}
function appInstallMountRoot(mountpoint,appId){
  const mp=String(mountpoint||'/').replace(/\/+$/,'')||'/';
  if(mp==='/')return `/opt/runvard/data/apps/${appId}`;
  return `${mp}/runvard/apps/${appId}`;
}
function appInstallJoin(root,folder){
  return `${String(root||'').replace(/\/+$/,'')}/${String(folder||'').replace(/^\/+/,'')}`;
}
function appInstallVolumeRole(v){
  const text=[v.label,v.source,v.target,v.folder].join(' ').toLowerCase();
  if(/media|movie|music|photo|photos|video|library|download|downloads|upload|uploads|backup|backups|books|audiobook|manga|originals/.test(text))return 'large';
  if(/db|database|postgres|mysql|mariadb|redis|config|metadata|thumb|cache|state|index/.test(text))return 'fast';
  return 'state';
}
function appInstallListItem(raw){
  return String(raw||'').trim().replace(/^-\s*/,'').trim().replace(/^['"]|['"]$/g,'');
}
function appInstallParseVolume(raw,index){
  const item=appInstallListItem(raw);
  const parts=item.split(':');
  const source=parts[0]||'';
  const target=parts[1]||'';
  const mode=parts[2]||'rw';
  const managed=appInstallIsManagedSource(source);
  const folder=managed?appInstallSlug(source.replace(/^\.\//,''),`volume-${index+1}`):appInstallBaseName(target||source,`volume-${index+1}`);
  return {
    raw:item,
    source,
    target,
    mode,
    managed,
    folder,
    label:folder.replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),
    mountpoint:'',
  };
}
function appInstallParsePort(raw){
  const item=appInstallListItem(raw);
  const [base,proto='']=item.split('/');
  const parts=base.split(':');
  if(parts.length>=2){
    return {raw:item,host:parts[0],container:parts.slice(1).join(':'),proto};
  }
  return {raw:item,host:'',container:base,proto};
}
function appComposeVisibleContent(){
  if(!_appInstallDraft)return '';

    source:_appInstallDraft.composeMode==='raw'?'raw':'form',
    syncRawToForm:false,
    checkPorts:false,
  });
  return appInstallCompose(_appInstallDraft);
}
function appComposeClearPortConflicts(){
  document.querySelectorAll('.compose-port-conflict').forEach(el=>el.classList.remove('compose-port-conflict'));
  $('#app-compose-raw')?.classList.remove('conflict');
  const alert=$('#app-compose-port-alert');
  if(alert){alert.classList.remove('open');alert.innerHTML='';}
}
function appComposeApplyPortConflicts(conflicts){
  appComposeClearPortConflicts();
  const list=conflicts||[];
  if(!list.length)return;
  const ports=new Set(list.map(x=>String(x.port)));
  _appInstallDraft.portConflicts=list;
  _appInstallDraft.ports.forEach((p,i)=>{
    if(ports.has(String(p.host))){
      $(`#app-port-host-${i}`)?.closest('.compose-field')?.classList.add('compose-port-conflict');
    }
  });
  if(_appInstallDraft.composeMode==='raw')$('#app-compose-raw')?.classList.add('conflict');
  const alert=$('#app-compose-port-alert');
  if(alert){
    const rows=list.map(x=>{
      const reason=x.reason==='duplicate'?uiText('Port is used more than once in this Compose file'):uiText('Port is already in use on this host');
      return `${uiText('Port')} ${esc(x.port)}${x.service?` (${esc(x.service)})`:''}: ${esc(reason)}`;
    });
    alert.innerHTML=`<strong>${esc(uiText('Choose free host ports before saving'))}</strong>${rows.map(r=>`<div>${r}</div>`).join('')}`;
    alert.classList.add('open');
  }
}
async function appComposeCheckPortsNow(){
  const d=_appInstallDraft;
  if(!d||!d.portCheckName)return {ok:true,conflicts:[]};
  const seq=++_appComposePortCheckSeq;
  const content=appComposeVisibleContent();
  try{
    const res=await post('/docker/compose/check-ports',{name:d.portCheckName,content});
    if(seq!==_appComposePortCheckSeq)return res;
    d.portConflicts=res.conflicts||[];
    appComposeApplyPortConflicts(d.portConflicts);
    return res;
  }catch(e){
    return {ok:false,conflicts:[],stderr:e.message};
  }
}
function appComposeSchedulePortCheck(){
  if(!_appInstallDraft?.portCheckName)return;
  clearTimeout(_appComposePortCheckTimer);
  _appComposePortCheckTimer=setTimeout(()=>appComposeCheckPortsNow(),350);
}
async function appComposeRequireFreePorts(){
  const d=_appInstallDraft;
  if(!d?.portCheckName)return;
  const res=await appComposeCheckPortsNow();
  if(res&&res.ok===false){
    const ports=(res.conflicts||[]).map(x=>x.port).join(', ');

    throw new Error(msg);
  }
}

  let section='';

function appComposeProjectDraft(name,composeData={}){
  const draft=appInstallParseCompose(composeData.content||'');
  draft.app={id:'compose:'+name,name,icon:'🐳',desc:'Custom Docker Compose project'};
  draft.portCheckName=name;
  draft.mounts=appInstallMounts([]);
  draft.envFileEnabled=!!composeData.env_enabled;
  draft.envFileContent=composeData.env_content||'';
  draft.volumes.forEach(v=>{if(v.managed)v.mountpoint=appInstallBestMount(draft.mounts,appInstallVolumeRole(v));});
  _appInstallDraft=draft;
  return draft;
}
async function appComposeDraft(appId,contentOverride,composeData={}){
  const [a,diskData]=await Promise.all([
    api('/apps/get?app_id='+encodeURIComponent(appId)),
    api('/system/disks').catch(()=>[])
  ]);
  const draft=appInstallParseCompose(contentOverride??(a.compose||''));
  draft.app=a;
  draft.mounts=appInstallMounts(diskData);
  draft.envFileEnabled=!!composeData.env_enabled;
  draft.envFileContent=composeData.env_content||'';
  draft.volumes.forEach(v=>{if(v.managed)v.mountpoint=appInstallBestMount(draft.mounts,appInstallVolumeRole(v));});
  _appInstallDraft=draft;
  return draft;
}
window.appInstallForm=async id=>{

};

function appCardHtml(a){
  const tint=appTint(a.category);
  const pending=appPendingActions.get(a.id);
  let actions,pill='';
  if(!a.installed){
    actions=`<button class="app-install-btn" onclick="appInstallForm('${a.id}')">${esc(uiText('Install'))}</button>`;
  } else {
    pill=pending
      ? `<span class="app-status-pill pending" title="${esc(appPendingLabel(pending))}"><span class="sd"></span>${esc(appPendingLabel(pending))}</span>`
      : a.update_available
      ? `<span class="app-status-pill upd" title="${esc(uiText('Update available'))}">${esc(uiText('Update'))}</span>`
      : a.running
        ? `<span class="app-status-pill run" title="${esc(uiText('Running'))}"><span class="sd"></span>${esc(uiText('Running'))}</span>`
        : `<span class="app-status-pill paused" title="${esc(uiText('Stopped'))}"><span class="sd"></span>${esc(uiText('Stopped'))}</span>`;
    const primary=pending
      ? `<button class="btn sm ghost" style="flex:1" disabled>${esc(appPendingLabel(pending))}</button>`
      : a.running
      ? `<button class="btn sm success" style="flex:1" onclick="appOpen('${a.id}',${a.port})">${esc(uiText('Open'))}</button>`
      : `<button class="btn sm" style="flex:1" onclick="appAct('${a.id}','start')">${esc(uiText('Start'))}</button>`;
    actions=`<div style="display:flex;gap:6px">${primary}<button class="btn icon" title="${esc(uiText('Actions'))}" onclick="appMenu(event,'${a.id}','${esc(a.name)}',${a.running?1:0},${a.update_available?1:0})" style="width:30px;height:30px;font-size:15px" ${pending?'disabled':''}>⋯</button></div>`;
  }
  return `<div class="app-card">
    ${pill}
    <div class="app-card-head">
      <div class="app-icon-wrap" style="background:${appHexA(tint,.12)};border-color:${appHexA(tint,.25)}">
        <img src="${esc(a.icon)}" alt="${esc(a.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="app-icon-fallback" style="display:none;background:${appHexA(tint,.18)};color:${tint}">${esc(a.name[0])}</div>
      </div>
      <div class="app-card-info"${a.installed?' style="padding-right:62px"':''}>
        <div class="app-card-name">${esc(a.name)}</div>
        <div class="app-card-meta">:${a.port||'—'}</div>
      </div>
    </div>
    <div class="app-card-desc">${esc(localizedAppDesc(a))}</div>
    <div class="app-card-actions">${actions}</div>
  </div>`;
}
