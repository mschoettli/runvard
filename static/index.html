async function renderNetwork(body,tab){
  const sub=(tab==='Firewall'||tab==='Docker')?tab:'Interfaces';
  const tabs=`<div class="modal-tabs sub-tabs">${['Interfaces','Firewall','Docker'].map(t=>`<div class="modal-tab${t===sub?' active':''}" onclick="renderNetwork($('#modal-body'),'${t}')">${esc(uiText(t))}</div>`).join('')}</div>`;
  if(sub==='Firewall'){
    const f=await api('/network/firewall/rules');
    body.innerHTML=tabs+viewIntro('Firewall','Allow or block network access. Keep rules simple unless you know exactly what a service needs.',`<button class="btn" onclick="fwAddForm()">Add rule</button>`)
      +`<div class="nx-summary-grid">${summaryCard('Firewall',f.active?'Active':'Inactive',f.backend||'Unknown backend')}${summaryCard('Rules',(f.rules||[]).length,'Configured')}</div>`
      +simpleTable(['No.','To','Action','From',''],(f.rules||[]).map(r=>`<tr><td>${r.num}</td><td class="mono">${esc(r.to)}</td><td>${statusBadge(esc(r.action),/ALLOW/i.test(r.action)?'good':'bad')}</td><td>${esc(r.from)}</td><td><button class="btn danger sm" onclick="fwDelete(${r.num})">Delete</button></td></tr>`).join(''));
    translateRenderedText(body);
    return;
  }
  if(sub==='Docker'){
    const av=await api('/docker/available');
    if(!av.available){body.innerHTML=tabs+viewIntro('Docker networks','Docker is not available on this server.','')+emptyState('Docker unavailable');translateRenderedText(body);return;}
    const nets=await api('/docker/networks');
    const unused=(nets||[]).filter(n=>n.unused);
    const builtin=(nets||[]).filter(n=>n.builtin);
    const actions=`<button class="btn danger" onclick="dockerNetworkPrune()" ${unused.length?'':'disabled'}>${esc(uiText('Delete unused Docker networks'))}</button>`;
    body.innerHTML=tabs+viewIntro('Docker networks','Docker keeps containers isolated. Remove unused Docker networks when Compose projects or containers have left old networks behind.',actions)
      +`<div class="nx-summary-grid">${summaryCard('Docker networks',(nets||[]).length,'All Docker networks')}${summaryCard('Unused networks',unused.length,'Safe to prune')}${summaryCard('System networks',builtin.length,'Docker built-in')}</div>`
      +simpleTable(['Name','Driver','Scope','Containers','Subnet',''],(nets||[]).map(n=>`<tr><td class="mono">${esc(n.name||'-')}</td><td>${esc(n.driver||'-')}</td><td>${esc(n.scope||'-')}</td><td>${esc(String(n.containers||0))}</td><td class="mono">${esc((n.subnets||[]).join(', ')||'-')}</td><td>${statusBadge(n.builtin?'System':n.unused?'Unused':'Connected',n.builtin?'warn':n.unused?'bad':'good')}</td></tr>`).join(''));
    translateRenderedText(body);
    return;
  }
  const dockerInterface=i=>/^docker/.test(i.name||'')||/^br-[0-9a-f]{12,}$/i.test(i.name||'')||/^veth/.test(i.name||'');
  const ifs=(await api('/network/interfaces')).filter(i=>!dockerInterface(i));
  const physical=ifs.filter(i=>i.is_physical);
  const virtual=ifs.filter(i=>!i.is_physical);
  const activePorts=physical.filter(i=>i.up);
  const ifaceCard=i=>`<div class="nx-action-card"><div class="nx-action-head"><div class="nx-action-title">${esc(i.name)}</div>${statusBadge(i.up?'Connected':'Down',i.up?'good':'bad')}</div><div class="nx-kv">${cardMetric('IP',esc(i.ipv4||'No IP'))}${cardMetric('Speed',i.speed?i.speed+' Mbit':'Unknown')}${cardMetric('MAC',esc(i.mac||'-'))}${cardMetric('Type',esc(i.type_label||i.interface_type||'Interface'))}</div><button class="btn ghost sm" onclick="ipConfigForm('${esc(i.name)}','${i.ipv4||''}')">Configure IP</button></div>`;
  body.innerHTML=tabs+viewIntro('Network interfaces','Physical ports are the real server NICs. Virtual and logical interfaces are shown separately for Docker, bridges, VLANs, bonds and tunnels.',`<button class="btn ghost" onclick="bondForm()">Bond</button><button class="btn ghost" onclick="bridgeForm()">Advanced: bridge</button><button class="btn ghost" onclick="vlanForm()">VLAN</button>`)
    +`<div class="nx-summary-grid">${summaryCard('Active ports',activePorts.length,activePorts.map(i=>i.name).join(', ')||'No physical port connected')}${summaryCard('Physical ports',physical.length,'Real NIC ports')}${summaryCard('Virtual interfaces',virtual.length,'Docker, bridge, VLAN, bond or tunnel')}</div>
      <div class="sec-hdr"><h3>Physical ports</h3></div>
      <div class="nx-card-grid">${physical.map(ifaceCard).join('')||emptyState('No physical ports detected')}</div>
      <div class="sec-hdr" style="margin-top:18px"><h3>Virtual and logical interfaces</h3></div>
      <div class="nx-card-grid">${virtual.map(ifaceCard).join('')||emptyState('No virtual interfaces')}</div>`;
  translateRenderedText(body);
}

    const activeAlerts=(alerts||[]).filter(x=>!x.resolved).length;
    body.innerHTML=viewIntro('System overview','This is the safe place to check health before changing settings.','')
      +`<div class="nx-summary-grid">${summaryCard('Server',esc(i.hostname),esc(i.os))}${summaryCard('Updates',u.updates||0,(u.updates||0)?'Attention needed':'System current')}${isExpertMode()?summaryCard('Alerts',activeAlerts,activeAlerts?'Review monitoring':'No active alerts'):''}${summaryCard('Uptime',fmtUptime(i.uptime_seconds),'Running time')}</div>
      <div class="nx-card-grid"><div class="nx-action-card"><div class="nx-action-title">Hardware</div><div class="nx-kv">${cardMetric('CPU',esc(i.cpu_model))}${cardMetric('Kernel',esc(i.kernel))}${cardMetric('Architecture',esc(i.arch))}${cardMetric('OS',esc(i.os))}</div></div></div>`;
    return;
  }
  if(tab==='Network'||tab==='Network')return renderNetwork(body,'Interfaces');
  if(tab==='Benutzer'||tab==='Users')return renderSecurity(body,'Benutzer');
  if(tab==='Services')return renderServicesSimple(body);
  if(tab==='Shares'||tab==='Shares')return renderSharesAll(body);
  if(tab==='Wartung'||tab==='Maintenance')return renderMaintenance(body);
  if(tab==='Advanced'){
    body.innerHTML=viewIntro('Advanced system tools','These tools can change low-level server behavior. Use them only when needed.','')
      +`<div class="nx-card-grid actions-grid">
        <div class="nx-action-card"><div class="nx-action-title">Packages</div><p class="nx-action-sub">Search, install or remove apt packages.</p><div class="nx-action-row"><button class="btn sm" onclick="renderSystem($('#modal-body'),'Pakete')">Open packages</button></div></div>
        <div class="nx-action-card"><div class="nx-action-title">AppArmor</div><p class="nx-action-sub">Inspect or change application security profiles.</p><div class="nx-action-row"><button class="btn sm" onclick="renderSystem($('#modal-body'),'AppArmor')">Open AppArmor</button></div></div>
        <div class="nx-action-card"><div class="nx-action-title">Cron</div><p class="nx-action-sub">Create scheduled command jobs.</p><div class="nx-action-row"><button class="btn sm" onclick="renderSystem($('#modal-body'),'Cron')">Open Cron</button></div></div>
      </div>`;
    return;
  }
  if(tab==='Cron'){
    const c=await api('/sysmgr/cron');
    body.innerHTML=viewIntro('Cron jobs','Run commands automatically on a schedule. Use this only for commands you already trust.',`<button class="btn" onclick="cronForm()">Create job</button>`)
      +simpleTable(['Schedule','Command'],c.map(x=>`<tr><td class="mono">${esc(x.schedule)}</td><td class="mono">${esc(x.command)}</td></tr>`).join(''));
    return;
  }
  if(['Pakete','AppArmor','Cron'].includes(tab)){
    const original={Pakete:renderPackages,AppArmor:renderAppArmor,Cron:null,Power:null}[tab];
    body.innerHTML=viewIntro('Advanced system tools','These tools can change low-level server behavior. Use them only when needed.','')+'<div id="advanced-system-body"></div>';
    const target=$('#advanced-system-body');
    if(original)return original(target);
  }
  return renderSystemOriginalFallback(body,tab);
}
async function renderServicesSimple(body){
  const s=await api('/services/list');
  body.innerHTML=viewIntro('Services','Start, stop or inspect system services. Changing core services can disconnect runvard.', '')
    +`<div class="nx-card-grid">${s.slice(0,80).map(x=>`<div class="nx-action-card"><div class="nx-action-head"><div class="service-title mono">${esc(x.name)}</div>${statusBadge(x.active,x.active==='active'?'good':'warn')}</div><div class="nx-action-row">${isExpertMode()?`<button class="btn ghost sm" onclick="svcAct('${esc(x.name)}','${x.active==='active'?'restart':'start'}')">${x.active==='active'?'Restart':'Start'}</button>`:''}<button class="btn ghost sm" onclick="svcLogs('${esc(x.name)}')">Logs</button></div></div>`).join('')}</div>`;
}
const renderSystemOriginalFallback=async(body,tab)=>{
  if(tab==='Updates'){
    body.innerHTML='<div class="loading">Checking updates…</div>';
    const [u,runvard]=await Promise.all([
      api('/sysmgr/updates'),
      api('/sysmgr/runvard-release').catch(e=>({remote:{ok:false,error:e.message}})),
    ]);
    const remote=runvard.remote||{};
    const rateLimited=!!remote.rate_limited;
    const runvardTone=!remote.ok?'warn':runvard.update_available?'bad':'good';
    const runvardLabel=!remote.ok&&rateLimited?'GitHub rate limit':!remote.ok?'Check failed':!runvard.local_known?'Local version unknown':runvard.update_available?'Update available':'Up to date';
    const remoteSub=remote.ok
      ? `Latest: ${esc(remote.short||'-')}${remote.source==='git'?' · '+uiText('Git fallback'):''}`
      : rateLimited
        ? 'GitHub API rate limit reached. Try again later.'
        : esc(remote.error||'GitHub unavailable');
    body.innerHTML=viewIntro('Updates','Install security updates and check whether a newer runvard version is available on GitHub.',u.updates>0?`<button class="btn" id="upd-go" onclick="updatesInstall()">Install package updates</button>`:'')
      +`<div class="nx-summary-grid">
        ${summaryCard('System packages',u.updates,u.updates?'Install when you can reboot if needed':'System current')}
        ${summaryCard('runvard GitHub',statusBadge(runvardLabel,runvardTone),remoteSub)}
      </div>
      <div class="nx-card-grid">
        <div class="nx-action-card">
          <div class="nx-action-head"><div class="nx-action-title">runvard repository</div></div>
          <div class="nx-kv">
            ${cardMetric('Installed',esc(runvard.local_short||'Unknown'))}
            ${cardMetric('GitHub main',esc(remote.short||'Unknown'))}
            ${cardMetric('Branch',esc(runvard.branch||'main'))}
            ${cardMetric('Latest commit date',esc(remote.date||'Unknown'))}
          </div>
          <div class="nx-action-row" style="justify-content:flex-end">
            ${runvard.update_available?`<button class="btn sm" id="runvard-upd-go" onclick="runvardUpdateInstall()">${esc(uiText('Update runvard'))}</button>`:''}
          </div>
          <div class="nx-card-inner" id="runvard-upd-status" style="display:none;margin-top:12px"></div>
        </div>
      </div>
      <pre class="logbox" id="upd-out" style="display:none;max-height:300px"></pre>`;
    _systemUpdateBadgeHasUpdates=(u.updates||0)>0||!!runvard.update_available;
    applySystemUpdateBadge();
  } else if(tab==='Shares'||tab==='Shares')return renderSharesAll(body);
  else if(tab==='Wartung'||tab==='Maintenance')return renderMaintenance(body);
  else if(tab==='Power')return renderPower(body);
  else body.innerHTML=viewIntro(tab||'System','This advanced section is still available.','')+emptyState('Open another tab to continue');
};
function renderDashboard(){
  const grid=$('#dash-grid');const section=$('#dash-section');if(!grid||!section)return;
  section.style.display='block';
  if(!dashTiles.length){grid.innerHTML=`<div class="nx-view-intro" style="grid-column:1/-1"><div><h3>Ready for apps</h3><p>Install apps or add custom shortcuts.</p></div><button class="btn" onclick="openTileById('apps')">Open apps</button></div>`;return;}
  grid.innerHTML=dashTiles.map(t=>{
    const isService=t.type==='app'||t.type==='compose';const status=dashTileStatus(t);const url=isService?dashTileAddress(t):(t.url||'').replace(/^https?:\/\//,'');const iconHtml=dashTileIconHtml(t.icon,t.name);const accent=t.accent||'#7a4aff';
    return `<div class="dash-tile" style="--tile-accent:${esc(accent)}" data-id="${esc(t.id)}" onclick="dashClick(event,'${esc(t.id)}')" oncontextmenu="dashCtx(event,'${esc(t.id)}')"><div class="dash-tile-body${t.show_url?' has-url':''}"><div class="dash-dots" onclick="event.stopPropagation();dashCtx(event,'${esc(t.id)}')">•••</div><div class="dash-status ${status.cls}" title="${esc(status.title)}"></div><div class="dash-tile-icon">${iconHtml}</div><div class="dash-tile-name">${esc(t.name)}</div>${t.note?`<div class="dash-tile-note">${esc(t.note)}</div>`:''}</div>${t.show_url?`<div class="dash-tile-footer"><div class="dash-tile-url">${esc(url)}</div></div>`:''}</div>`;
  }).join('');
  if(typeof Sortable!=='undefined'){Sortable.create(grid,{animation:150,ghostClass:'sortable-ghost',chosenClass:'sortable-chosen',onEnd:()=>{const order=[...grid.querySelectorAll('.dash-tile')].map(el=>el.dataset.id);post('/dashboard/order',{order:JSON.stringify(order)});}});}
}

function nxAddClear(inp){
  if(!inp||inp.dataset.nxClear)return;
  inp.dataset.nxClear='1';
  const wrap=document.createElement('span');
  wrap.className='nx-search-wrap';
  ['flexGrow','flexShrink','flexBasis','width','minWidth','maxWidth'].forEach(p=>{
    const v=inp.style[p];
    if(v){wrap.style[p]=v;inp.style[p]='';}
  });
  inp.parentNode.insertBefore(wrap,inp);
  wrap.appendChild(inp);
  inp.style.flex='1 1 auto';
  inp.style.width='100%';
  inp.style.minWidth='0';
  inp.classList.add('nx-has-clear');
  const btn=document.createElement('button');
  btn.type='button';
  btn.className='nx-clear-btn';
  btn.tabIndex=-1;
  btn.title=uiText('Clear search');
  btn.setAttribute('aria-label',uiText('Clear search'));
  btn.textContent='✕';
  btn.addEventListener('mousedown',e=>e.preventDefault());
  btn.addEventListener('click',()=>{
    inp.value='';
    inp.dispatchEvent(new Event('input',{bubbles:true}));
    inp.focus();
    sync();
  });
  wrap.appendChild(btn);
  const sync=()=>wrap.classList.toggle('has-text',inp.value.length>0);
  inp.addEventListener('input',sync);
  sync();
}
function nxDecorateSearch(root){
  (root||document).querySelectorAll('input.nx-search:not([data-nx-clear])').forEach(nxAddClear);
}
(()=>{
  nxDecorateSearch(document);
  if(!window.MutationObserver)return;
  const TEXT_SKIP='input,textarea,script,style,.xterm,.logbox,.mono';
  const queue=new Set();
  let scheduled=false;
  const flush=()=>{
    scheduled=false;
    const nodes=[...queue];queue.clear();
    nodes.forEach(n=>{
      if(!n.isConnected)return;
      if(n.nodeType===1){
        nxDecorateSearch(n);
        translateRenderedText(n);
      }else if(n.nodeType===3){
        if(n.parentElement&&n.parentElement.closest(TEXT_SKIP))return;
        const raw=n.nodeValue,trimmed=raw.trim();
        if(!trimmed)return;
        const t=phrase(trimmed);
        if(t!==trimmed)n.nodeValue=raw.replace(trimmed,t);
      }
    });
  };
  new MutationObserver(records=>{
    records.forEach(r=>{
      if(r.type==='childList')r.addedNodes.forEach(n=>queue.add(n));
      else if(r.type==='attributes')queue.add(r.target);
      else if(r.type==='characterData')queue.add(r.target);
    });
    if(scheduled)return;scheduled=true;
    requestAnimationFrame(flush);
  }).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['title','placeholder','aria-label']});
})();
