<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Runvard · Sign in</title>
<link rel="icon" type="image/png" href="/static/runvard-icon.png">
<link rel="apple-touch-icon" href="/static/runvard-icon.png">
<script>
try{
  const theme=localStorage.getItem('runvard_ui_theme');
  document.documentElement.dataset.uiTheme=theme==='modern'?'modern':'original';
}catch(_){document.documentElement.dataset.uiTheme='original';}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0b14;--bg2:#0d0e1a;--bg3:#111221;--glass:rgba(255,255,255,.04);--glass-hover:rgba(122,74,255,.08);--border:rgba(255,255,255,.06);--border-accent:rgba(122,74,255,.3);--text:#f0f0ff;--text2:rgba(240,240,255,.55);--text3:rgba(240,240,255,.28);--accent:#7a4aff;--accent-light:#9d7aff;--green:#22c55e;--red:#ef4444;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
html{background:#0f0c1a}
body{font-family:'Plus Jakarta Sans',sans-serif;background:radial-gradient(ellipse at 60% 0%,#1a1040 0%,#0a0b14 60%);background-attachment:fixed;color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;transition:background .24s ease,color .2s ease}
.login-wrap{width:100%;max-width:380px}
.brand{text-align:center;margin-bottom:24px}
.brand-icon{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 14px;box-shadow:0 16px 40px rgba(0,0,0,.34)}
.brand .logo{font-size:26px;font-weight:700;letter-spacing:.06em;color:#fff}
.brand .sub{font-size:12px;color:var(--text3);margin-top:6px;letter-spacing:.04em}
.theme-picker{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;padding:4px 4px 4px 12px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.025)}
.theme-picker-label{color:var(--text3);font-size:11px;font-weight:600;letter-spacing:.04em}
.theme-options{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;border-radius:9px;background:rgba(0,0,0,.18)}
.theme-option{min-width:76px;min-height:44px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--text2);font:600 11px/1 'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:background .16s ease,color .16s ease,box-shadow .16s ease}
.theme-option:hover{color:var(--text)}
.theme-option[aria-pressed="true"]{background:rgba(122,74,255,.2);color:var(--accent-light);box-shadow:inset 0 0 0 1px rgba(122,74,255,.24)}
.theme-option:focus-visible{outline:2px solid var(--accent-light);outline-offset:2px}
.card{background:var(--bg2);border:1px solid var(--border-accent);border-radius:16px;padding:28px 26px;box-shadow:0 16px 48px rgba(0,0,0,.5)}
.card h1{font-size:16px;font-weight:600;margin-bottom:20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:7px}
.field input{width:100%;min-height:44px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:14px;transition:border-color .15s,background .15s,box-shadow .15s}
.field input:focus{outline:none;border-color:rgba(122,74,255,.5);background:rgba(122,74,255,.04)}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;font-size:12px;color:var(--text2)}
.row label{display:flex;align-items:center;gap:7px;cursor:pointer}
.row input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.btn-login{width:100%;min-height:44px;background:var(--accent);color:#fff;border:none;padding:11px;border-radius:9px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,box-shadow .15s,transform .15s}
.btn-login:hover{background:#8d64ff}
.btn-login:focus-visible{outline:2px solid var(--accent-light);outline-offset:3px}
.btn-login:disabled{opacity:.6;cursor:not-allowed}
.error{display:none;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#f87171;border-radius:9px;padding:10px 12px;font-size:12.5px;margin-bottom:16px}
.error.show{display:block}
.foot{text-align:center;font-size:11px;color:var(--text3);margin-top:20px;line-height:1.6}
.lock-note{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;font-size:11px;color:var(--text3)}

html[data-ui-theme="modern"]{color-scheme:light;background:#e7eef7;--bg2:rgba(255,255,255,.72);--text:#17263a;--text2:#52657d;--text3:#8190a3;--accent:#3973e6;--accent-light:#3973e6;--border:rgba(85,111,143,.14);--border-accent:rgba(57,115,230,.18)}
html[data-ui-theme="modern"] body{background:radial-gradient(circle at 12% 12%,rgba(100,158,225,.2),transparent 34rem),radial-gradient(circle at 88% 88%,rgba(83,184,166,.12),transparent 30rem),linear-gradient(145deg,#f4f8fc 0%,#e7eef7 52%,#edf4f8 100%);color:var(--text)}
html[data-ui-theme="modern"] .login-wrap{max-width:400px}
html[data-ui-theme="modern"] .brand{display:grid;grid-template-columns:58px minmax(0,1fr);grid-template-rows:auto auto;column-gap:14px;align-items:center;margin-bottom:20px;text-align:left}
html[data-ui-theme="modern"] .brand-icon{grid-row:1/3;width:58px;height:58px;margin:0;border:1px solid rgba(255,255,255,.88);border-radius:16px;box-shadow:0 12px 28px rgba(52,83,119,.14)}
html[data-ui-theme="modern"] .brand .logo{align-self:end;color:var(--text);font-size:23px;letter-spacing:.025em}
html[data-ui-theme="modern"] .brand .sub{align-self:start;margin-top:3px;color:var(--text3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
html[data-ui-theme="modern"] .theme-picker{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.46);box-shadow:0 8px 24px rgba(50,78,111,.06),inset 0 1px 0 rgba(255,255,255,.84);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
html[data-ui-theme="modern"] .theme-picker-label{color:var(--text3)}
html[data-ui-theme="modern"] .theme-options{background:rgba(93,119,151,.09)}
html[data-ui-theme="modern"] .theme-option{color:var(--text2)}
html[data-ui-theme="modern"] .theme-option:hover{color:var(--text)}
html[data-ui-theme="modern"] .theme-option[aria-pressed="true"]{background:rgba(255,255,255,.92);color:var(--accent);box-shadow:0 3px 10px rgba(42,72,108,.1),inset 0 0 0 1px rgba(57,115,230,.1)}
html[data-ui-theme="modern"] .card{position:relative;overflow:hidden;border-color:rgba(255,255,255,.84);border-radius:20px;background:rgba(255,255,255,.7);box-shadow:0 24px 60px rgba(48,75,110,.14),inset 0 1px 0 rgba(255,255,255,.96);backdrop-filter:blur(24px) saturate(1.08);-webkit-backdrop-filter:blur(24px) saturate(1.08)}
html[data-ui-theme="modern"] .card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#3973e6,#72a6ed 62%,#63b7a8)}
html[data-ui-theme="modern"] .card h1{color:var(--text);font-size:18px;letter-spacing:-.015em}
html[data-ui-theme="modern"] .field label{color:var(--text2);font-weight:600}
html[data-ui-theme="modern"] .field input{border-color:rgba(91,119,153,.16);background:rgba(247,250,253,.82);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.84)}
html[data-ui-theme="modern"] .field input:hover{border-color:rgba(57,115,230,.24);background:rgba(255,255,255,.94)}
html[data-ui-theme="modern"] .field input:focus{border-color:rgba(57,115,230,.54);background:#fff;box-shadow:0 0 0 3px rgba(57,115,230,.1)}
html[data-ui-theme="modern"] .row{color:var(--text2)}
html[data-ui-theme="modern"] .row input[type=checkbox]{accent-color:var(--accent)}
html[data-ui-theme="modern"] .btn-login{background:var(--accent);box-shadow:0 9px 20px rgba(57,115,230,.2)}
html[data-ui-theme="modern"] .btn-login:hover{background:#2f67d4;box-shadow:0 12px 24px rgba(57,115,230,.25);transform:translateY(-1px)}
html[data-ui-theme="modern"] .btn-login:active{transform:translateY(0)}
html[data-ui-theme="modern"] .error{border-color:rgba(199,76,76,.2);background:rgba(199,76,76,.07);color:#a43f3f}
html[data-ui-theme="modern"] .lock-note,html[data-ui-theme="modern"] .foot{color:var(--text3)}

@media(min-width:768px){
  body{padding:24px}
  html[data-ui-theme="modern"] .login-wrap{max-width:420px}
  html[data-ui-theme="modern"] .card{padding:32px 30px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand">
      <img class="brand-icon" src="/static/runvard-icon.png" alt="" aria-hidden="true">
      <div class="logo">Runvard</div>
      <div class="sub">Server Panel</div>
    </div>
    <div class="theme-picker" role="group" aria-labelledby="theme-picker-label">
      <span class="theme-picker-label" id="theme-picker-label" data-i18n="appearance">Design</span>
      <div class="theme-options">
        <button class="theme-option" type="button" data-theme="original" aria-pressed="true" data-i18n="original">Original</button>
        <button class="theme-option" type="button" data-theme="modern" aria-pressed="false" data-i18n="modern">Modern</button>
      </div>
    </div>
    <div class="card">
      <h1 data-i18n="title">Sign in</h1>
      <div class="error" id="error"></div>
      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="username" data-i18n="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password" data-i18n="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <div class="row">
          <label><input type="checkbox" id="remember" name="remember"> <span data-i18n="remember">Stay signed in</span></label>
        </div>
        <button type="submit" class="btn-login" id="submit-btn" data-i18n="submit">Sign in</button>
      </form>
      <div class="lock-note" id="conn-note"></div>
    </div>
    <div class="foot">Runvard Server Panel</div>
  </div>

<script>
const $=s=>document.querySelector(s);
const form=$('#login-form'), errBox=$('#error'), btn=$('#submit-btn');
const DEFAULT_LANG='__RUNVARD_DEFAULT_LANG__';
const UI_THEME_KEY='runvard_ui_theme';
const TEXT={
  en:{
    appearance:'Design',original:'Original',modern:'Modern',
    title:'Sign in',
    username:'Username',
    password:'Password',
    remember:'Stay signed in',
    submit:'Sign in',
    signingIn:'Signing in...',
    insecure:'Unencrypted connection - HTTPS recommended',
    tooMany:'Too many attempts. Please wait a moment.',
    invalid:'Username or password is incorrect.',
    failed:'Sign-in failed',
    connection:'Connection to the server failed.'
  },
  de:{
    appearance:'Design',original:'Original',modern:'Modern',
    title:'Anmeldung',
    username:'Benutzername',
    password:'Passwort',
    remember:'Angemeldet bleiben',
    submit:'Anmelden',
    signingIn:'Anmelden...',
    insecure:'Unverschlüsselte Verbindung – HTTPS empfohlen',
    tooMany:'Zu viele Versuche. Bitte kurz warten.',
    invalid:'Benutzername oder Passwort falsch.',
    failed:'Anmeldung fehlgeschlagen',
    connection:'Verbindung zum Server fehlgeschlagen.'
  },
  fr:{
    appearance:'Apparence',original:'Original',modern:'Moderne',
    title:'Connexion',
    username:'Nom d’utilisateur',
    password:'Mot de passe',
    remember:'Rester connecté',
    submit:'Se connecter',
    signingIn:'Connexion…',
    insecure:'Connexion non chiffrée – HTTPS recommandé',
    tooMany:'Trop de tentatives. Veuillez patienter un instant.',
    invalid:'Le nom d’utilisateur ou le mot de passe est incorrect.',
    failed:'Échec de la connexion',
    connection:'La connexion au serveur a échoué.'
  },
  it:{
    appearance:'Aspetto',original:'Originale',modern:'Moderno',
    title:'Accedi',
    username:'Nome utente',
    password:'Password',
    remember:'Resta connesso',
    submit:'Accedi',
    signingIn:'Accesso…',
    insecure:'Connessione non crittografata – HTTPS consigliato',
    tooMany:'Troppi tentativi. Attendi un momento.',
    invalid:'Nome utente o password non corretti.',
    failed:'Accesso non riuscito',
    connection:'Connessione al server non riuscita.'
  },
  es:{
    appearance:'Diseño',original:'Original',modern:'Moderno',
    title:'Iniciar sesión',
    username:'Nombre de usuario',
    password:'Contraseña',
    remember:'Mantener la sesión iniciada',
    submit:'Iniciar sesión',
    signingIn:'Iniciando sesión…',
    insecure:'Conexión sin cifrar – se recomienda HTTPS',
    tooMany:'Demasiados intentos. Espera un momento.',
    invalid:'El nombre de usuario o la contraseña son incorrectos.',
    failed:'Error al iniciar sesión',
    connection:'No se pudo conectar con el servidor.'
  },
  pt:{
    appearance:'Aspeto',original:'Original',modern:'Moderno',
    title:'Iniciar sessão',
    username:'Nome de utilizador',
    password:'Palavra-passe',
    remember:'Manter sessão iniciada',
    submit:'Iniciar sessão',
    signingIn:'A iniciar sessão…',
    insecure:'Ligação não cifrada – HTTPS recomendado',
    tooMany:'Demasiadas tentativas. Aguarde um momento.',
    invalid:'O nome de utilizador ou a palavra-passe está incorreto.',
    failed:'Falha ao iniciar sessão',
    connection:'Falha na ligação ao servidor.'
  }
};
function lang(){
  const supported=Object.keys(TEXT);
  try{
    const saved=localStorage.getItem('runvard_language');
    if(supported.includes(saved))return saved;
  }catch(_){}
  return supported.includes(DEFAULT_LANG)?DEFAULT_LANG:'en';
}
function t(key){
  return (TEXT[lang()]&&TEXT[lang()][key])||TEXT.en[key]||key;
}
function applyLanguage(){
  document.documentElement.lang=lang();
  document.title='Runvard · '+t('title');
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent=t(el.getAttribute('data-i18n'));
  });
}
applyLanguage();

function applyUiTheme(theme,persist=false){
  theme=theme==='modern'?'modern':'original';
  document.documentElement.dataset.uiTheme=theme;
  document.querySelectorAll('.theme-option').forEach(option=>{
    option.setAttribute('aria-pressed',String(option.dataset.theme===theme));
  });
  if(persist){
    try{localStorage.setItem(UI_THEME_KEY,theme);}catch(_){}
  }
}
document.querySelectorAll('.theme-option').forEach(option=>{
  option.addEventListener('click',()=>applyUiTheme(option.dataset.theme,true));
});
applyUiTheme(document.documentElement.dataset.uiTheme);

if(location.protocol!=='https:' && location.hostname!=='localhost' && location.hostname!=='127.0.0.1'){
  $('#conn-note').textContent='WARN '+t('insecure');
}

function showError(msg){errBox.textContent=msg;errBox.classList.add('show');}
function clearError(){errBox.classList.remove('show');}

form.addEventListener('submit', async e=>{
  e.preventDefault();
  clearError();
  btn.disabled=true; btn.textContent=t('signingIn');
  try{
    const body=new URLSearchParams();
    body.set('username', $('#username').value);
    body.set('password', $('#password').value);
    body.set('remember', $('#remember').checked ? '1' : '0');
    const r=await fetch('/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body,
      credentials:'same-origin'
    });
    let data={}; try{data=await r.json();}catch(_){}
    if(r.ok && data.ok){
      const params=new URLSearchParams(location.search);
      location.href = params.get('next') || '/';
      return;
    }
    if(r.status===429){ showError(t('tooMany')); }
    else if(r.status===401){ showError(t('invalid')); }
    else { showError(t('failed')+' ('+r.status+').'); }
  }catch(err){
    showError(t('connection'));
  }finally{
    btn.disabled=false; btn.textContent=t('submit');
  }
});
</script>
</body>
</html>
