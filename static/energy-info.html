<style>
:root{--bg:#0a0b14;--bg2:rgba(13,14,26,.86);--bg3:rgba(17,18,33,.68);--glass:rgba(255,255,255,.04);--glass-hover:rgba(122,74,255,.08);--border:rgba(255,255,255,.08);--border-accent:rgba(122,74,255,.3);--text:#f0f0ff;--text2:rgba(240,240,255,.62);--text3:rgba(240,240,255,.36);--accent:#7a4aff;--accent-light:#9d7aff;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--radius:12px;--blur:blur(16px)}
*{margin:0;padding:0;box-sizing:border-box}
html{background:#0f0c1a}
body{font-family:'Plus Jakarta Sans',sans-serif;background:radial-gradient(ellipse at 20% 50%,#6d28d9,transparent 55%),radial-gradient(ellipse at 80% 20%,#0891b2,transparent 50%),radial-gradient(ellipse at 60% 80%,#1e1b4b,transparent 50%),#050714;background-attachment:fixed;color:var(--text);min-height:100vh}
.mono{font-family:'JetBrains Mono',monospace}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 24px;background:var(--bg2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:42px;min-width:0}
.brand-name{font-size:15px;font-weight:700;letter-spacing:.04em;color:#fff;text-transform:uppercase}
.brand-sep{color:rgba(240,240,255,.32);font-size:14px;line-height:1}
.brand-system{color:rgba(240,240,255,.45);font-size:13px;font-weight:500;letter-spacing:0}
.top-actions{display:flex;align-items:center;justify-content:flex-end;justify-self:stretch}
.lang-switch{display:flex;align-items:center;gap:4px;padding:3px;background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:10px}
.lang-switch button{min-width:34px;height:26px;border:0;border-radius:7px;background:transparent;color:var(--text3);font:600 11px 'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:background .15s,color .15s}
.lang-switch button:hover{background:var(--glass-hover);color:var(--accent-light)}
.lang-switch button.active{background:rgba(122,74,255,.18);color:var(--text);box-shadow:inset 0 0 0 1px rgba(122,74,255,.32)}
.container{max-width:1120px;margin:0 auto;padding:28px}
.nx-view-intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:linear-gradient(135deg,rgba(122,74,255,.12),rgba(6,182,212,.06));border:1px solid var(--border-accent);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.nx-view-intro h1{font-size:20px;font-weight:700;margin-bottom:6px;color:var(--text);letter-spacing:0}
.nx-view-intro p{font-size:13px;color:var(--text2);line-height:1.55;max-width:760px}
.status-pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:4px 9px;font-size:10px;font-weight:600;background:rgba(234,179,8,.1);color:#facc15;border:1px solid rgba(234,179,8,.18);white-space:nowrap}
.status-pill.run{background:rgba(34,197,94,.1);color:#4ade80;border-color:rgba(34,197,94,.2)}
.status-pill.stop{background:rgba(239,68,68,.1);color:#f87171;border-color:rgba(239,68,68,.18)}
.section-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin:22px 0 12px}
.nx-summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.nx-summary-card{background:var(--bg3);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:10px;padding:13px;min-width:0}
.nx-summary-card .k{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.nx-summary-card .v{font-size:20px;font-weight:700;color:var(--text);line-height:1.15}
.nx-summary-card .s{font-size:11px;color:var(--text3);margin-top:5px;line-height:1.35}
.nx-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:16px}
.nx-action-card{background:var(--bg3);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:12px;padding:18px;min-width:0;transition:border-color .15s,transform .15s}
.nx-action-card:hover{border-color:var(--border-accent);transform:translateY(-1px)}
.nx-action-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.nx-action-title{font-size:14px;font-weight:700;color:var(--text);line-height:1.3}
.nx-action-sub{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:12px}
.nx-kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.nx-kv div{background:rgba(255,255,255,.03);border-radius:8px;padding:8px;min-width:0}
.nx-kv span{display:block;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.nx-kv strong{display:block;font-size:12px;color:var(--text);line-height:1.35}
.nx-chip-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.nx-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:999px;padding:4px 9px;font-size:11px;color:var(--text2)}
.nx-chip.good{border-color:rgba(34,197,94,.24);color:#4ade80;background:rgba(34,197,94,.08)}
.nx-chip.warn{border-color:rgba(234,179,8,.24);color:#facc15;background:rgba(234,179,8,.08)}
.nx-chip.bad{border-color:rgba(239,68,68,.24);color:#f87171;background:rgba(239,68,68,.08)}
.info-band{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.info-band h2{font-size:14px;margin-bottom:8px}
.info-band p{font-size:12px;color:var(--text2);line-height:1.6}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.flow-step{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:12px}
.flow-step .num{width:24px;height:24px;border-radius:8px;background:rgba(122,74,255,.16);border:1px solid var(--border-accent);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--accent-light);margin-bottom:9px}
.flow-step strong{display:block;font-size:12px;margin-bottom:5px}
.flow-step span{display:block;font-size:11px;color:var(--text3);line-height:1.45}
.footer-note{font-size:11px;color:var(--text3);line-height:1.5;margin:24px 0 8px}
@media(max-width:760px){
  .topbar{grid-template-columns:1fr;padding:10px 16px;gap:6px}
  .top-actions{justify-self:stretch;justify-content:flex-end}
  .lang-switch{max-width:100%;overflow-x:auto}
  .container{padding:18px 16px}
  .nx-view-intro{grid-template-columns:1fr}
  .flow{grid-template-columns:1fr}
}
</style>

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chip=([text,tone])=>`<span class="nx-chip ${esc(tone)}">${esc(text)}</span>`;
const badge=(text,tone='')=>`<span class="status-pill ${esc(tone)}">${esc(text)}</span>`;
const kv=items=>items?`<div class="nx-kv">${items.map(([k,v])=>`<div><span>${esc(k)}</span><strong class="${['suspend','hibernate','hybrid-sleep','suspend-then-hibernate'].includes(v)?'mono':''}">${esc(v)}</strong></div>`).join('')}</div>`:'';
const card=item=>`<article class="nx-action-card"><div class="nx-action-head"><div class="nx-action-title">${esc(item.title)}</div>${item.badge?badge(item.badge,item.tone||''):badge('optional')}</div><p class="nx-action-sub">${esc(item.copy)}</p>${item.kv?kv(item.kv):''}${item.chips?`<div class="nx-chip-list">${item.chips.map(chip).join('')}</div>`:''}</article>`;
const section=(label,items)=>`<div class="section-label">${esc(label)}</div><section class="nx-card-grid">${items.map(card).join('')}</section>`;
function bestLang(){
  try{const stored=localStorage.getItem('runvard_language');if(DATA[stored])return stored;}catch(e){}
  const nav=(navigator.language||'de').slice(0,2);
  return DATA[nav]?nav:'de';
}
function render(lang){
  const d=DATA[lang]||DATA.de;
  document.documentElement.lang=d.htmlLang;
  document.title=d.title;
  document.getElementById('page').innerHTML=`
    <section class="nx-view-intro"><div><h1>${esc(d.heroTitle)}</h1><p>${esc(d.heroCopy)}</p></div>${badge(d.heroBadge,'run')}</section>
    <div class="nx-summary-grid">${d.summaries.map(([k,v,s])=>`<div class="nx-summary-card"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="s">${esc(s)}</div></div>`).join('')}</div>
    <section class="info-band"><h2>${esc(d.warningTitle)}</h2><p>${esc(d.warningCopy)}</p></section>
    ${section(d.directLabel,d.direct)}
    ${section(d.sleepLabel,d.sleep)}
    ${section(d.profilesLabel,d.profiles)}
    ${section(d.idleLabel,d.idle)}
    <div class="section-label">${esc(d.inhibitorsLabel)}</div><section class="info-band"><h2>${esc(d.inhibitorsTitle)}</h2><p>${esc(d.inhibitorsCopy)}</p></section>
    ${section(d.toolsLabel,d.tools)}
    <div class="section-label">${esc(d.flowLabel)}</div><section class="flow">${d.flow.map(([title,copy],i)=>`<div class="flow-step"><div class="num">${i+1}</div><strong>${esc(title)}</strong><span>${esc(copy)}</span></div>`).join('')}</section>
    <p class="footer-note">${esc(d.footer)}</p>`;
  document.querySelectorAll('#lang-switch button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
}
document.getElementById('lang-switch').innerHTML=LANGUAGES.map(l=>`<button type="button" data-lang="${l.code}" title="${esc(l.name)}">${l.code.toUpperCase()}</button>`).join('');
document.getElementById('lang-switch').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-lang]');
  if(!btn)return;
  try{localStorage.setItem('runvard_language',btn.dataset.lang);}catch(err){}
  render(btn.dataset.lang);
});
render(bestLang());
</script>
