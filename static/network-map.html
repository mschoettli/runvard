<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>runvard</title><link rel="icon" href="/static/runvard-icon.png">
<script>try{document.documentElement.dataset.uiTheme=localStorage.getItem('runvard_ui_theme')==='modern'?'modern':'original';}catch(e){}</script>
<link rel="stylesheet" href="/static/network-map.css"><link rel="stylesheet" href="/static/modern-theme.css">
<script defer src="/static/network-map.js"></script></head>
<body data-default-lang="__RUNVARD_DEFAULT_LANG__">
<header class="topbar"><a class="brand" href="/">RUNVARD</a><span data-t="title"></span><nav><a href="/" data-t="back"></a><select id="language" aria-label="Language"><option value="de">Deutsch</option><option value="en">English</option><option value="fr">Français</option><option value="it">Italiano</option><option value="es">Español</option><option value="pt">Português</option></select></nav></header>
<main><div class="heading"><div><h1 data-t="title"></h1><p data-t="subtitle"></p></div><div class="actions"><button id="scan" class="btn" data-t="scan"></button><button id="mesh" class="btn ghost" data-t="mesh"></button><button id="settings" class="btn ghost" data-t="settings"></button></div></div>
<div id="message" role="status" aria-live="polite"></div>
<div class="toolbar"><input id="search" type="search" data-placeholder="search"><select id="filter"><option value="all" data-t="all"></option><option value="lan" data-t="lan"></option><option value="zigbee">Zigbee</option><option value="online" data-t="online"></option><option value="offline" data-t="offline"></option><option value="unknown" data-t="unknown"></option></select><span id="count"></span><span id="connection"></span></div>
<div class="workspace"><section class="map-panel"><div id="viewport" tabindex="0"><div id="world"><svg id="edges" aria-hidden="true"></svg><div id="nodes"></div></div><p id="empty"></p></div><footer><span><i class="line"></i><span data-t="zigbee"></span></span><span><i class="line manual"></i><span data-t="manual"></span></span><div class="zoom"><button id="minus" data-aria="zoomOut">−</button><output id="zoom">100%</output><button id="plus" data-aria="zoomIn">+</button><button id="fit" data-t="fit"></button></div></footer></section><aside class="panel" id="details"></aside></div>
<p class="hint" data-t="hint"></p><div class="timestamps"><span id="scan-time"></span><span id="mesh-time"></span></div>
</main>
<dialog id="settings-dialog"><form id="settings-form"><div class="heading"><h2 data-t="settings"></h2><button type="button" id="close-settings" class="btn ghost" data-t="close"></button></div><label><span data-t="networks"></span><textarea id="networks" rows="3" spellcheck="false"></textarea></label><label><span data-t="zigbeeUrl"></span><input id="zigbee-url" type="url" placeholder="http://192.168.1.2:8080" autocomplete="off"></label><label><span data-t="token"></span><input id="token" type="password" autocomplete="new-password"></label><label class="check"><input id="clear-token" type="checkbox"><span data-t="clearToken"></span></label><p class="hint" data-t="meshHint"></p><button class="btn" data-t="save"></button><p id="settings-message" role="status"></p></form></dialog>
</body></html>
