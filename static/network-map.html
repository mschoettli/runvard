<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>runvard</title><link rel="icon" href="/static/runvard-icon.png">
<script src="/static/network-map-theme.js?v=2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/modern-theme.css"><link rel="stylesheet" href="/static/network-map.css?v=3">
<script defer src="/static/network-map-layout.js?v=3"></script><script defer src="/static/network-map.js?v=3"></script></head>
<body data-default-lang="__RUNVARD_DEFAULT_LANG__">
<header class="topbar"><a class="brand" href="/">RUNVARD</a><span class="header-divider"></span><span data-t="title"></span><nav><a href="/" data-t="back"></a><select id="language" aria-label="Language"><option value="de">Deutsch</option><option value="en">English</option><option value="fr">Français</option><option value="it">Italiano</option><option value="es">Español</option><option value="pt">Português</option></select></nav></header>
<main><div class="page-heading"><div class="page-heading-copy"><div class="eyebrow" data-t="overview"></div><h1 data-t="title"></h1><p data-t="subtitle"></p></div><div class="actions"><button id="mesh" class="btn ghost" data-t="mesh"></button><button id="settings" class="btn ghost" data-t="settings"></button><button id="scan" class="btn" data-t="scan"></button></div></div>
<div id="message" role="status" aria-live="polite"></div>
<div class="workspace"><section class="map-panel"><div class="map-toolbar"><div class="search-wrap"><span id="search-icon" aria-hidden="true"></span><input id="search" type="search" data-placeholder="search"></div><select id="filter"><option value="all" data-t="all"></option><option value="lan" data-t="lan"></option><option value="zigbee">Zigbee</option><option value="online" data-t="online"></option><option value="offline" data-t="offline"></option><option value="unknown" data-t="unknown"></option></select><span id="count" class="count"></span></div><div id="viewport" tabindex="0"><div id="canvas"><div id="world"><svg id="edges" aria-hidden="true"></svg><div id="nodes"></div></div></div><p id="empty"></p></div><footer><div class="legend"><span><i class="line"></i><span data-t="zigbee"></span></span><span><i class="line manual"></i><span data-t="manual"></span></span></div><div class="zoom"><button id="minus" data-aria="zoomOut">−</button><output id="zoom">100%</output><button id="plus" data-aria="zoomIn">+</button><button id="fit" data-t="resetView"></button></div></footer></section><aside class="side-stack"><section class="panel" id="details"></section><section class="integration-panel" id="integration"><div class="integration-title"><span id="integration-icon" aria-hidden="true"></span><div><span class="eyebrow" data-t="integrations"></span><h2>Zigbee2MQTT</h2></div><span id="integration-dot" class="status-dot"></span></div><p id="connection"></p><p id="integration-copy" class="hint"></p><button id="setup-zigbee" class="btn ghost" data-t="setupZigbee"></button></section></aside></div>
<div class="bottom-bar"><p class="hint" data-t="connectionNote"></p><div class="timestamps"><span id="scan-time"></span><span id="mesh-time"></span></div></div>
</main>
<dialog id="settings-dialog"><form id="settings-form"><div class="dialog-heading"><h2 data-t="settings"></h2><button type="button" id="close-settings" class="btn ghost" data-t="close"></button></div><label><span data-t="networks"></span><textarea id="networks" rows="3" spellcheck="false"></textarea></label><label><span data-t="zigbeeUrl"></span><input id="zigbee-url" type="url" placeholder="http://192.168.1.2:8080" autocomplete="off"></label><label><span data-t="token"></span><input id="token" type="password" autocomplete="new-password"></label><label class="check"><input id="clear-token" type="checkbox"><span data-t="clearToken"></span></label><p class="hint" data-t="meshHint"></p><button class="btn" data-t="save"></button><p id="settings-message" role="status"></p></form></dialog>
</body></html>
