<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUNVARD</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182536;background:#edf4fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(ellipse at 50% 38%,#fff 0,transparent 62%),#edf4fb}button,select{font:inherit}button,select{min-height:44px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #3973e6;outline-offset:4px}.top{min-height:80px;padding:18px clamp(16px,4vw,64px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid #d9e4ef}.brand{font-size:15px;font-weight:800;letter-spacing:.07em;display:flex;align-items:center;gap:12px}.brand span{font-size:11px;font-weight:600;letter-spacing:.04em;color:#6a7e96;border-left:1px solid #c4d2e1;padding-left:12px}.tools{display:flex;gap:8px;flex-wrap:wrap}select,.reset{border:1px solid #cfdae8;border-radius:10px;background:#ffffffb8;color:#43566d;padding:0 12px;font-size:13px}.board{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;max-width:1480px;padding:32px 16px;margin:auto;align-items:center}.intro{max-width:390px;margin:auto;width:100%}.eyebrow{font-size:10px;font-weight:750;letter-spacing:.16em;color:#3973e6;margin:0 0 16px}h1{font-size:36px;line-height:1.1;letter-spacing:-.045em;margin:0 0 16px;font-weight:730}.description{font-size:15px;line-height:1.65;color:#60748c;margin:0 0 24px}.scenario-label{font-size:11px;color:#71849a;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}.scenarios{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.scenario{border:1px solid #d3dfec;background:#ffffff80;border-radius:12px;padding:12px 8px;text-align:left;color:#52677f;display:flex;gap:8px;align-items:center;min-width:0;font-size:12px}.scenario .num{font-size:10px;color:#7c8fa5;font-variant-numeric:tabular-nums}.scenario[aria-pressed=true]{border-color:#3973e6;background:#fff;color:#225ac4;box-shadow:0 4px 15px #3973e60d}.scenario-hint{color:#6e829a;font-size:13px;line-height:1.6;min-height:42px;margin:16px 0 0}.device-wrap{display:flex;flex-direction:column;gap:14px;align-items:center;min-width:0}.device{width:min(100%,390px);height:min(790px,84svh);min-height:480px;background:#fff;border:6px solid #fff;border-radius:30px;box-shadow:0 30px 80px #34577d1f,0 0 0 1px #cfdae9;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#f6f9fe}.device-caption{font-size:11px;display:flex;gap:7px;align-items:center;color:#6a819a}.device-caption:before{content:"";width:5px;height:5px;border-radius:50%;background:#3973e6}.notes{max-width:390px;margin:auto;display:grid;gap:24px}.notes h2{font-size:16px;letter-spacing:-.02em;margin:0}.note{display:grid;grid-template-columns:24px 1fr;gap:12px}.note-index{font-size:10px;color:#3973e6;border-top:1px solid #9ebbe9;padding-top:6px}.note h3{font-size:13px;margin:0 0 6px}.note p{font-size:12px;line-height:1.65;color:#71849a;margin:0}.offline{border-top:1px solid #d4e0ee;padding-top:18px;color:#7b8da1;font-size:11px;line-height:1.6;margin:0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(min-width:1100px){.board{grid-template-columns:minmax(220px,1fr) 390px minmax(200px,1fr);gap:clamp(24px,4vw,68px);min-height:calc(100svh - 80px);padding:32px 48px}.intro,.notes{margin:0}.intro{max-width:320px}h1{font-size:46px}.scenarios{grid-template-columns:1fr}.scenario{padding:14px}.scenario .num{width:20px}.notes{max-width:240px;justify-self:end}.device{height:min(790px,calc(100svh - 148px))}}
@media(max-width:480px){.top{padding:12px 16px;gap:8px}.brand span{display:none}.tools select,.reset{font-size:12px;padding:0 8px}.board{padding:24px 12px}.device{border-width:4px;border-radius:22px}.intro{padding:0 4px}h1{font-size:32px}.notes{padding:12px 4px}.description{margin-bottom:16px}}
</style>
<script src="mobile-modal-preview/catalog.js"></script>
</head>
<body>
<header class="top"><div class="brand">RUNVARD <span data-text="title"></span></div><div class="tools"><label class="sr" for="language" data-text="language"></label><select id="language"><option value="de">Deutsch</option><option value="en">English</option><option value="fr">Français</option><option value="it">Italiano</option><option value="es">Español</option><option value="pt">Português</option></select><button class="reset" id="reset" data-text="reset"></button></div></header>
<main class="board">
<section class="intro"><p class="eyebrow" data-text="eyebrow"></p><h1 data-text="intro"></h1><p class="description" data-text="description"></p><p class="scenario-label" data-text="scenarios"></p><nav class="scenarios" data-label="scenarios"><button class="scenario" data-scenario="system" aria-pressed="true"><span class="num">01</span><span data-text="system"></span></button><button class="scenario" data-scenario="form" aria-pressed="false"><span class="num">02</span><span data-text="form"></span></button><button class="scenario" data-scenario="confirmation" aria-pressed="false"><span class="num">03</span><span data-text="confirmation"></span></button></nav><p class="scenario-hint" id="scenario-hint"></p></section>
<div class="device-wrap"><div class="device"><iframe id="preview" src="mobile-modal-preview/app.html" title="RUNVARD"></iframe></div><div class="device-caption" data-text="demo"></div></div>
<aside class="notes"><h2 data-text="noteTitle"></h2><div class="note"><span class="note-index">01</span><div><h3 data-text="note1"></h3><p data-text="note1Body"></p></div></div><div class="note"><span class="note-index">02</span><div><h3 data-text="note2"></h3><p data-text="note2Body"></p></div></div><div class="note"><span class="note-index">03</span><div><h3 data-text="note3"></h3><p data-text="note3Body"></p></div></div><p class="offline" data-text="offline"></p></aside>
</main>
<script>
let locale='de',scenario='system';const frame=document.querySelector('#preview');
function send(action,value){frame.contentWindow.postMessage({type:'runvard-preview',action,value},'*');}
function translate(){document.documentElement.lang=locale;document.title='RUNVARD · '+previewText(locale,'title');document.querySelectorAll('[data-text]').forEach(e=>e.textContent=previewText(locale,e.dataset.text));document.querySelectorAll('[data-label]').forEach(e=>e.setAttribute('aria-label',previewText(locale,e.dataset.label)));document.querySelector('#scenario-hint').textContent=previewText(locale,scenario+'Hint');frame.title=previewText(locale,'title');}
document.querySelector('#language').onchange=e=>{locale=e.target.value;translate();send('locale',locale);};
document.querySelectorAll('[data-scenario]').forEach(b=>b.onclick=()=>{scenario=b.dataset.scenario;document.querySelectorAll('[data-scenario]').forEach(e=>e.setAttribute('aria-pressed',String(e===b)));translate();send('scenario',scenario);});
document.querySelector('#reset').onclick=()=>send('reset',scenario);
window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='runvard-preview-ready'){send('locale',locale);send('scenario',scenario);}});translate();
</script>
</body></html>
