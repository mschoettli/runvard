Match User runvard-replica
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand /opt/runvard/venv/bin/python /opt/runvard/scripts/time-machine-receiver.py
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY no
